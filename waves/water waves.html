<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>水波槽實驗模型</title>
    <meta name="description" content="模擬水波干涉與繞射，點擊畫面可設置波源或障礙物。">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水波槽實驗模型 - 邊界無反射與波源參數化版</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0d11;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 860px;
        }
        .sub-toolbar {
            background: #181a24;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #2a2d3d;
            margin-bottom: 10px;
            align-items: center;
        }
        button {
            background: #222530;
            color: #4da6ff;
            border: 1px solid #445;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover { background: #333848; color: #fff; }
        button.active { background: #0066cc; color: #fff; border-color: #0088ff; }

        .ctrl-group {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #ccc;
            background: #11131c;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #333748;
        }
        .ctrl-group input[type=range] {
            width: 80px;
            cursor: pointer;
            accent-color: #0088ff;
        }
        .ctrl-val {
            color: #ffcc00;
            font-weight: bold;
            min-width: 32px;
        }

        .main-display {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .canvas-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 2px solid #334;
            box-shadow: 0 0 25px rgba(0, 162, 255, 0.2);
            border-radius: 4px;
            touch-action: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #annotationCanvas {
            pointer-events: none;
            z-index: 2;
        }

        .graph-container {
            width: 160px;
            height: 480px;
            background-color: #12131c;
            border: 2px solid #334;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .graph-title {
            font-size: 12px;
            color: #ffcc00;
            margin: 6px 0 2px 0;
            font-weight: bold;
        }
        .graph-sub {
            font-size: 10px;
            color: #889;
            margin-bottom: 4px;
        }
        #graphCanvas {
            position: static;
            width: 150px;
            height: 430px;
            background: #090a0f;
            border-radius: 2px;
        }

        .info {
            margin-top: 10px;
            font-size: 13px;
            color: #889;
        }
    </style>
</head>
<body>

    <!-- 主工具列 -->
    <div class="toolbar">
        <button id="modeWave" class="active" onclick="setMode('wave')">🌊 波源模式</button>
        <button id="modeObstacle" onclick="setMode('obstacle')">🧱 畫障礙物</button>
        <button id="modeShallow" onclick="setMode('shallow')">🏝️ 畫淺水區</button>
        <button id="modeDeep" onclick="setMode('deep')">🌊 畫深水區</button>
        <button onclick="applyPreset('doubleSlit')">✨ 預設：雙縫干涉</button>
        <button onclick="applyPreset('refraction')">✨ 預設：折射斜面</button>
        <button onclick="clearWavesOnly()" style="color: #ff9933; border-color: #885522;">💧 清除水波</button>
        <button onclick="clearMap()">🧹 重置全部地圖</button>
    </div>

    <!-- 波源與邊界細部設定列 -->
    <div class="toolbar sub-toolbar" id="waveSubToolbar">
        <span style="font-size: 13px; color: #aaa;">波源：</span>
        <button id="srcSingle" class="active" onclick="setWaveType('single')">🔴 單點</button>
        <button id="srcLine" onclick="setWaveType('line')">➖ 線波源</button>
        <button id="srcDouble" onclick="setWaveType('double')">👯 雙點</button>
        
        <span style="font-size: 13px; color: #aaa; margin-left: 4px;">方式：</span>
        <button id="emitPulse" class="active" onclick="setWaveEmitMode('pulse')">⚡ 脈衝</button>
        <button id="emitContinuous" onclick="setWaveEmitMode('continuous')">🌊 連續波</button>

        <span style="font-size: 13px; color: #aaa; margin-left: 4px;">邊界：</span>
        <button id="boundReflect" onclick="setBoundaryMode('reflect')">🧱 反射</button>
        <button id="boundAbsorb" class="active" onclick="setBoundaryMode('absorb')">🧽 無反射吸收</button>

        <!-- 動態參數控制項 -->
        <span class="ctrl-group">
            <label>頻率:</label>
            <input type="range" id="sliderFreq" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateParams()">
            <span class="ctrl-val" id="valFreq">1.0x</span>
        </span>

        <span class="ctrl-group" id="groupDist">
            <label>雙點間距:</label>
            <input type="range" id="sliderDist" min="0.5" max="4.0" step="0.1" value="2.0" oninput="updateParams()">
            <span class="ctrl-val" id="valDist">2.0 λ</span>
        </span>

        <button id="btnToggleGraph" class="active" onclick="toggleGraph()" style="margin-left: 4px;">📊 強度圖</button>
    </div>

    <!-- 教學標註工具列 -->
    <div class="toolbar">
        <button id="btnPause" onclick="togglePause()">⏸️ 暫停模擬</button>
        <button id="penSolid" onclick="setPen('solid')">✏️ 實線畫筆</button>
        <button id="penDashed" onclick="setPen('dashed')">➖ 虛線畫筆</button>
        <button onclick="clearAnnotation()">🧽 清除畫筆標註</button>
    </div>

    <!-- 主要畫面區（水波槽 + 右側相對強度圖） -->
    <div class="main-display">
        <div class="canvas-container">
            <canvas id="waveCanvas" width="640" height="480"></canvas>
            <canvas id="annotationCanvas" width="640" height="480"></canvas>
        </div>
        <div class="graph-container" id="graphBox">
            <div class="graph-title">相對強度圖 [I/I_max]</div>
            <div class="graph-sub">偵測線位置分佈</div>
            <canvas id="graphCanvas" width="150" height="430"></canvas>
        </div>
    </div>

    <div class="info" id="statusText">目前模式：【波源】單點波源 / 單次脈衝 / 無反射吸收邊界</div>

    <script>
        const waveCanvas = document.getElementById('waveCanvas');
        const waveCtx = waveCanvas.getContext('2d');
        const annoCanvas = document.getElementById('annotationCanvas');
        const annoCtx = annoCanvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');
        const graphBox = document.getElementById('graphBox');

        const width = 320;
        const height = 240;
        const detectX = width - 30; // 右側偵測線位置 (x = 290)

        let buffer1 = new Float32Array(width * height);
        let buffer2 = new Float32Array(width * height);
        let speedMap = new Float32Array(width * height).fill(0.45);
        let obstacleMap = new Uint8Array(width * height);
        let intensityEnvelope = new Float32Array(height);

        const damping = 0.993; 
        const imgData = waveCtx.createImageData(width, height);
        const data = imgData.data;

        let isPaused = false;
        let showGraph = true;            
        let currentMode = 'wave';       
        let waveType = 'single';         
        let waveEmitMode = 'pulse';      
        let boundaryMode = 'absorb';    

        // 波源動態參數
        let freqScale = 1.0;
        let doubleDistLambda = 2.0;
        
        let penMode = 'solid';
        let isDrawing = false;
        let activePointerGrid = null;
        let waveTime = 0;

        let lastGridX = null, lastGridY = null;

        // 計算目前設定下的網格波長 λ (Grid Units)
        function getWavelengthGrid() {
            const c = Math.sqrt(0.45); // 波速
            const omega = 0.25 * freqScale;
            return (c * 2 * Math.PI) / omega; // 預設約 16.85 格
        }

        function updateParams() {
            freqScale = parseFloat(document.getElementById('sliderFreq').value);
            doubleDistLambda = parseFloat(document.getElementById('sliderDist').value);
            document.getElementById('valFreq').innerText = freqScale.toFixed(1) + 'x';
            document.getElementById('valDist').innerText = doubleDistLambda.toFixed(1) + ' λ';
        }

        function updateWave() {
            if (isPaused) return;

            // 連續週期波注入
            if (isDrawing && currentMode === 'wave' && waveEmitMode === 'continuous' && activePointerGrid) {
                waveTime += 0.25 * freqScale;
                const val = Math.sin(waveTime) * 250;
                triggerWaveSource(activePointerGrid.x, activePointerGrid.y, val);
            }

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const i = y * width + x;

                    if (obstacleMap[i] === 1) {
                        buffer2[i] = 0;
                        continue;
                    }

                    const cSq = speedMap[i];
                    const laplacian = buffer1[i - 1] + buffer1[i + 1] + buffer1[i - width] + buffer1[i + width] - 4 * buffer1[i];

                    let nextVal = (2 * buffer1[i] - buffer2[i] + laplacian * cSq) * damping;

                    // 無反射邊界（零回波 Smooth Cubic Sponge Layer）
                    if (boundaryMode === 'absorb') {
                        const margin = 42;
                        const distEdge = Math.min(x, width - 1 - x, y, height - 1 - y);
                        if (distEdge < margin) {
                            const ratio = (margin - distEdge) / margin; // 0 at margin, 1 at edge
                            // 漸進式阻尼曲線，完全避免阻抗不匹配產生的反射
                            const dampFactor = 1.0 - 0.22 * Math.pow(ratio, 2.2);
                            nextVal *= dampFactor;
                        }
                    }

                    buffer2[i] = nextVal;
                }
            }

            // 最外圍邊緣強制衰減
            if (boundaryMode === 'absorb') {
                for (let x = 0; x < width; x++) {
                    buffer2[x] *= 0.5;
                    buffer2[(height - 1) * width + x] *= 0.5;
                }
                for (let y = 0; y < height; y++) {
                    buffer2[y * width] *= 0.5;
                    buffer2[y * width + (width - 1)] *= 0.5;
                }
            }

            let temp = buffer1;
            buffer1 = buffer2;
            buffer2 = temp;

            // 更新右側強度包絡線
            if (showGraph) {
                for (let y = 0; y < height; y++) {
                    const absVal = Math.abs(buffer1[y * width + detectX]);
                    intensityEnvelope[y] = intensityEnvelope[y] * 0.94 + absVal * 0.06;
                }
            }
        }

        function renderWave() {
            let p = 0;
            for (let i = 0; i < buffer1.length; i++) {
                if (obstacleMap[i] === 1) {
                    data[p] = 70; data[p + 1] = 80; data[p + 2] = 95; data[p + 3] = 255;
                } else {
                    const v = buffer1[i];
                    const c = Math.max(-255, Math.min(255, v));
                    const isShallow = speedMap[i] < 0.3;

                    const baseR = isShallow ? 140 : 50;
                    const baseG = isShallow ? 200 : 130;
                    const baseB = isShallow ? 190 : 200;

                    data[p]     = Math.min(255, Math.max(0, baseR + c * 1.2));
                    data[p + 1] = Math.min(255, Math.max(0, baseG + c * 1.5));
                    data[p + 2] = Math.min(255, Math.max(0, baseB + c * 1.8));
                    data[p + 3] = 255;
                }
                p += 4;
            }

            const offscreen = document.createElement('canvas');
            offscreen.width = width;
            offscreen.height = height;
            offscreen.getContext('2d').putImageData(imgData, 0, 0);

            waveCtx.imageSmoothingEnabled = true;
            waveCtx.drawImage(offscreen, 0, 0, waveCanvas.width, waveCanvas.height);

            // 繪製黃色虛線偵測軸
            if (showGraph) {
                waveCtx.beginPath();
                waveCtx.strokeStyle = 'rgba(255, 204, 0, 0.5)';
                waveCtx.lineWidth = 1.5;
                waveCtx.setLineDash([4, 4]);
                const screenDetectX = detectX * (waveCanvas.width / width);
                waveCtx.moveTo(screenDetectX, 0);
                waveCtx.lineTo(screenDetectX, waveCanvas.height);
                waveCtx.stroke();
                waveCtx.setLineDash([]);
            }
        }

        function renderGraph() {
            if (!showGraph) return;

            const gw = graphCanvas.width;
            const gh = graphCanvas.height;

            graphCtx.fillStyle = '#090a0f';
            graphCtx.fillRect(0, 0, gw, gh);

            let maxEnv = 0;
            for (let y = 0; y < height; y++) {
                if (intensityEnvelope[y] > maxEnv) maxEnv = intensityEnvelope[y];
            }
            const scaleFactor = Math.max(maxEnv, 2.0);

            // 參考虛線
            graphCtx.strokeStyle = '#1a1d29';
            graphCtx.lineWidth = 1;
            const refXs = [15, 15 + 110 * 0.5, 15 + 110];
            refXs.forEach(x => {
                graphCtx.beginPath();
                graphCtx.setLineDash([2, 2]);
                graphCtx.moveTo(x, 0);
                graphCtx.lineTo(x, gh);
                graphCtx.stroke();
            });
            graphCtx.setLineDash([]);

            // 藍色即時波形
            graphCtx.beginPath();
            graphCtx.strokeStyle = 'rgba(0, 162, 255, 0.6)';
            graphCtx.lineWidth = 1.2;
            for (let y = 0; y < height; y++) {
                const screenY = (y / height) * gh;
                const val = Math.abs(buffer1[y * width + detectX]);
                const normVal = Math.min(1.0, val / scaleFactor);
                const screenX = 15 + normVal * 110;
                
                if (y === 0) graphCtx.moveTo(screenX, screenY);
                else graphCtx.lineTo(screenX, screenY);
            }
            graphCtx.stroke();

            // 黃色相對強度包絡線
            graphCtx.beginPath();
            graphCtx.strokeStyle = '#ffcc00';
            graphCtx.lineWidth = 2.2;
            for (let y = 0; y < height; y++) {
                const screenY = (y / height) * gh;
                const normEnv = Math.min(1.0, intensityEnvelope[y] / scaleFactor);
                const screenX = 15 + normEnv * 110;
                
                if (y === 0) graphCtx.moveTo(screenX, screenY);
                else graphCtx.lineTo(screenX, screenY);
            }
            graphCtx.stroke();

            // 文字標註
            graphCtx.fillStyle = '#667';
            graphCtx.font = '10px sans-serif';
            graphCtx.fillText('0', 12, gh - 6);
            graphCtx.fillText('I_max', 115, gh - 6);
        }

        function loop() {
            updateWave();
            renderWave();
            renderGraph();
            requestAnimationFrame(loop);
        }

        function dropPoint(x, y, radius, strength) {
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        if (dx * dx + dy * dy <= radius * radius) {
                            buffer1[ny * width + nx] = strength;
                        }
                    }
                }
            }
        }

        function triggerWaveSource(x, y, strength) {
            if (waveType === 'single') {
                dropPoint(x, y, 2, strength);
            } else if (waveType === 'line') {
                const len = 35;
                for (let dy = -len; dy <= len; dy++) {
                    dropPoint(x, y + dy, 1, strength * 0.7);
                }
            } else if (waveType === 'double') {
                const lambdaGrid = getWavelengthGrid();
                const halfDist = Math.round((doubleDistLambda * lambdaGrid) / 2);
                dropPoint(x, y - halfDist, 2, strength);
                dropPoint(x, y + halfDist, 2, strength);
            }
        }

        // 圓形蓋印地圖編輯 (圓滑地圖筆觸)
        function applyCircularStamp(cx, cy, radius, type) {
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    if (dx * dx + dy * dy <= radius * radius) {
                        const nx = cx + dx, ny = cy + dy;
                        if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            const i = ny * width + nx;
                            if (type === 'obstacle') obstacleMap[i] = 1;
                            else if (type === 'shallow') { obstacleMap[i] = 0; speedMap[i] = 0.12; }
                            else if (type === 'deep') { obstacleMap[i] = 0; speedMap[i] = 0.45; }
                        }
                    }
                }
            }
        }

        function drawLineInterpolated(x0, y0, x1, y1, callback) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                callback(x0, y0);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        function toggleGraph() {
            showGraph = !showGraph;
            graphBox.style.display = showGraph ? 'flex' : 'none';
            const btn = document.getElementById('btnToggleGraph');
            btn.classList.toggle('active', showGraph);
            btn.innerText = showGraph ? '📊 強度圖' : '📊 強度圖(關)';
        }

        function clearWavesOnly() {
            buffer1.fill(0);
            buffer2.fill(0);
            intensityEnvelope.fill(0);
            waveTime = 0;
        }

        function clearMap() {
            clearWavesOnly();
            obstacleMap.fill(0);
            speedMap.fill(0.45);
        }

        function setMode(mode) {
            currentMode = mode;
            if (isPaused) togglePause(); // 切換模式時自動解除暫停

            document.querySelectorAll('.toolbar button').forEach(b => {
                if (['modeWave', 'modeObstacle', 'modeShallow', 'modeDeep'].includes(b.id)) {
                    b.classList.remove('active');
                }
            });

            if(mode === 'wave') document.getElementById('modeWave').classList.add('active');
            if(mode === 'obstacle') document.getElementById('modeObstacle').classList.add('active');
            if(mode === 'shallow') document.getElementById('modeShallow').classList.add('active');
            if(mode === 'deep') document.getElementById('modeDeep').classList.add('active');
            
            document.getElementById('waveSubToolbar').style.display = (mode === 'wave') ? 'flex' : 'none';
            document.getElementById('groupDist').style.display = (mode === 'wave' && waveType === 'double') ? 'inline-flex' : 'none';
            updateStatus();
        }

        function setWaveType(type) {
            waveType = type;
            document.getElementById('srcSingle').classList.toggle('active', type === 'single');
            document.getElementById('srcLine').classList.toggle('active', type === 'line');
            document.getElementById('srcDouble').classList.toggle('active', type === 'double');
            document.getElementById('groupDist').style.display = (type === 'double') ? 'inline-flex' : 'none';
            updateStatus();
        }

        function setWaveEmitMode(mode) {
            waveEmitMode = mode;
            document.getElementById('emitPulse').classList.toggle('active', mode === 'pulse');
            document.getElementById('emitContinuous').classList.toggle('active', mode === 'continuous');
            updateStatus();
        }

        function setBoundaryMode(mode) {
            boundaryMode = mode;
            document.getElementById('boundReflect').classList.toggle('active', mode === 'reflect');
            document.getElementById('boundAbsorb').classList.toggle('active', mode === 'absorb');
            updateStatus();
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('btnPause').innerHTML = isPaused ? "▶️ 繼續模擬" : "⏸️ 暫停模擬";
            annoCanvas.style.pointerEvents = isPaused ? "auto" : "none";
            updateStatus();
        }

        function setPen(type) {
            penMode = type;
            if (!isPaused) togglePause();
        }

        function updateStatus() {
            const txt = document.getElementById('statusText');
            if (isPaused) {
                txt.innerText = `目前模式：【已暫停】教學畫筆 (${penMode === 'solid' ? '實線' : '虛線'}) - 請在畫面上直接標註`;
                txt.style.color = '#ffaa00';
            } else {
                if (currentMode === 'wave') {
                    const typeName = waveType === 'single' ? '單點波源' : (waveType === 'line' ? '線波源' : '雙點波源');
                    const emitName = waveEmitMode === 'pulse' ? '單次脈衝' : '連續週期波';
                    const boundName = boundaryMode === 'reflect' ? '反射邊界' : '無反射吸收邊界';
                    txt.innerText = `目前模式：【波源】${typeName} / ${emitName} / ${boundName} (頻率:${freqScale.toFixed(1)}x)`;
                } else {
                    txt.innerText = `目前模式：【編輯地圖】劃過畫面可修改區域`;
                }
                txt.style.color = '#889';
            }
        }

        function applyPointerAction(currX, currY) {
            if (currentMode === 'wave') {
                if (waveEmitMode === 'pulse') {
                    triggerWaveSource(currX, currY, 350);
                } else if (waveEmitMode === 'continuous') {
                    waveTime = Math.PI / 2;
                    triggerWaveSource(currX, currY, 250);
                }
            } else {
                const action = (x, y) => {
                    if (currentMode === 'obstacle') applyCircularStamp(x, y, 3, 'obstacle');
                    else if (currentMode === 'shallow') applyCircularStamp(x, y, 7, 'shallow');
                    else if (currentMode === 'deep') applyCircularStamp(x, y, 7, 'deep');
                };

                if (lastGridX !== null && lastGridY !== null) {
                    drawLineInterpolated(lastGridX, lastGridY, currX, currY, action);
                } else {
                    action(currX, currY);
                }
                lastGridX = currX;
                lastGridY = currY;
            }
        }

        function getGridCoords(e) {
            const rect = waveCanvas.getBoundingClientRect();
            const scaleX = width / rect.width;
            const scaleY = height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            return { x: Math.max(0, Math.min(width - 1, x)), y: Math.max(0, Math.min(height - 1, y)) };
        }

        // Pointer 事件處理
        waveCanvas.addEventListener('pointerdown', (e) => {
            if (isPaused) return;
            waveCanvas.setPointerCapture(e.pointerId);
            isDrawing = true;
            const coords = getGridCoords(e);
            activePointerGrid = coords;
            lastGridX = null; lastGridY = null;
            applyPointerAction(coords.x, coords.y);
        });

        waveCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || isPaused) return;
            const coords = getGridCoords(e);
            activePointerGrid = coords;
            if (currentMode !== 'wave') {
                applyPointerAction(coords.x, coords.y);
            }
        });

        const stopDrawingWave = (e) => {
            if (isDrawing) {
                isDrawing = false;
                activePointerGrid = null;
                lastGridX = null; lastGridY = null;
                try { waveCanvas.releasePointerCapture(e.pointerId); } catch(err){}
            }
        };
        waveCanvas.addEventListener('pointerup', stopDrawingWave);
        waveCanvas.addEventListener('pointercancel', stopDrawingWave);

        // 教師畫筆平滑事件 (二次貝茲曲線中點運算)
        let strokePoints = [];

        annoCanvas.addEventListener('pointerdown', (e) => {
            annoCanvas.setPointerCapture(e.pointerId);
            isDrawing = true;
            const rect = annoCanvas.getBoundingClientRect();
            strokePoints = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
        });

        annoCanvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isPaused) return;
            const rect = annoCanvas.getBoundingClientRect();
            strokePoints.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });

            if (strokePoints.length >= 3) {
                const p1 = strokePoints[strokePoints.length - 3];
                const p2 = strokePoints[strokePoints.length - 2];
                const p3 = strokePoints[strokePoints.length - 1];

                const mid1 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
                const mid2 = { x: (p2.x + p3.x) / 2, y: (p2.y + p3.y) / 2 };

                annoCtx.beginPath();
                annoCtx.strokeStyle = '#ff3366';
                annoCtx.lineWidth = 3;
                annoCtx.lineCap = 'round';
                annoCtx.lineJoin = 'round';
                annoCtx.setLineDash(penMode === 'dashed' ? [8, 6] : []);
                annoCtx.moveTo(mid1.x, mid1.y);
                annoCtx.quadraticCurveTo(p2.x, p2.y, mid2.x, mid2.y);
                annoCtx.stroke();
            }
        });

        const stopDrawingAnno = (e) => {
            if (isDrawing) {
                isDrawing = false;
                strokePoints = [];
                try { annoCanvas.releasePointerCapture(e.pointerId); } catch(err){}
            }
        };
        annoCanvas.addEventListener('pointerup', stopDrawingAnno);
        annoCanvas.addEventListener('pointercancel', stopDrawingAnno);

        function clearAnnotation() {
            annoCtx.clearRect(0, 0, annoCanvas.width, annoCanvas.height);
        }

        function applyPreset(type) {
            clearMap();
            if (type === 'doubleSlit') {
                const wallX = 100;
                for (let y = 0; y < height; y++) {
                    if ((y >= 20 && y <= 100) || (y >= 115 && y <= 125) || (y >= 140 && y <= 220)) {
                        for (let dx = -2; dx <= 2; dx++) {
                            obstacleMap[y * width + (wallX + dx)] = 1;
                        }
                    }
                }
            } else if (type === 'refraction') {
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        if (x * 0.6 + y > 160) {
                            speedMap[y * width + x] = 0.12;
                        }
                    }
                }
            }
        }

        loop();
    </script>
</body>
