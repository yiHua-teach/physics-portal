            shortName: '元素與化合物的混合物',
            explanation: '容器內同時混雜了「兩種結構不同的分子」（藍色雙原子元素 N₂ ＋ 紅白三原子化合物 H₂O），含有兩種以上物質，因此屬於【混合物】！',
            build: (w, h) => {
              const arr = [];
              for (let i = 0; i < 5; i++) {
                arr.push({ shape: 'di_same', a1: 'N', x: 60 + Math.random() * (w - 120), y: 55 + Math.random() * (h - 110), vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, ang: Math.random() * 6, va: 0.02 });
              }
              for (let i = 0; i < 5; i++) {
                arr.push({ shape: 'tri_bent', a1: 'O', a2: 'H', x: 60 + Math.random() * (w - 120), y: 55 + Math.random() * (h - 110), vx: (Math.random() - 0.5) * 1.4, vy: (Math.random() - 0.5) * 1.4, ang: Math.random() * 6, va: -0.025 });
              }
              return arr;
            }
          },
          {
            id: 5,
            title: '第 5 題：進階思考！兩種元素放在一起屬於哪一類？',
            answer: 'mixture',
            answerLabel: '混合物',
            shortName: '兩種元素的混合物（He + O₂）',
            explanation: '雖然橘色單原子（He）和紅色雙原子（O₂）各自都是元素，但當它們「混在同一個容器內且未互相化合」時，含有兩種不同物質，整體屬於【混合物】！',
            build: (w, h) => {
              const arr = [];
              for (let i = 0; i < 6; i++) {
                arr.push({ shape: 'mono', a1: 'He', x: 55 + Math.random() * (w - 110), y: 55 + Math.random() * (h - 110), vx: (Math.random() - 0.5) * 1.7, vy: (Math.random() - 0.5) * 1.7, ang: 0, va: 0 });
              }
              for (let i = 0; i < 5; i++) {
                arr.push({ shape: 'di_same', a1: 'O', x: 55 + Math.random() * (w - 110), y: 55 + Math.random() * (h - 110), vx: (Math.random() - 0.5) * 1.3, vy: (Math.random() - 0.5) * 1.3, ang: Math.random() * 6, va: 0.028 });
              }
              return arr;
            }
          }
        ];

        let currentIdx = 0;
        let score = 0;
        let answered = false;
        let records = [];

        function init() {
          qCanvas = document.getElementById('quizCanvas');
          qCtx = qCanvas.getContext('2d');
          resize();
          window.addEventListener('resize', resize);

          document.querySelectorAll('.quiz-opt-btn').forEach((btn) => {
            btn.addEventListener('click', () => handleAnswer(btn.dataset.choice));
          });
          document.getElementById('btnQuizNext').addEventListener('click', nextQuestion);
          document.getElementById('btnQuizRestart').addEventListener('click', restart);
          document.getElementById('btnBackToAnim').addEventListener('click', () => switchTab('animation'));

          loadQuestion(0);
        }

        function resize() {
          if (!qCanvas) return;
          const rect = qCanvas.parentElement.getBoundingClientRect();
          if (rect.width < 10 || rect.height < 10) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          QW = rect.width;
          QH = rect.height;
          qCanvas.width = Math.round(QW * dpr);
          qCanvas.height = Math.round(QH * dpr);
          qCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function loadQuestion(idx) {
          currentIdx = idx;
          answered = false;
          const q = QUESTIONS[idx];

          document.getElementById('quizQuestionCard').style.display = '';
          document.getElementById('quizSummaryCard').classList.remove('show');

          document.getElementById('quizStepLabel').textContent = `第 ${idx + 1} / ${QUESTIONS.length} 題`;
          document.getElementById('quizProgressFill').style.width = `${((idx + 1) / QUESTIONS.length) * 100}%`;
          document.getElementById('quizScorePill').textContent = `目前得分：${score} / ${QUESTIONS.length}`;
          document.getElementById('quizQTitle').textContent = q.title;

          document.querySelectorAll('.quiz-opt-btn').forEach((btn) => {
            btn.disabled = false;
            btn.classList.remove('correct', 'wrong');
          });
          const fb = document.getElementById('quizFeedback');
          fb.classList.remove('show', 'ok', 'err');
          document.getElementById('btnQuizNext').textContent = idx === QUESTIONS.length - 1 ? '查看總成績 🏆' : '下一題 ➜';

          resize();
          qParticles = q.build(QW, QH);
        }

        function handleAnswer(choice) {
          if (answered) return;
          answered = true;
          const q = QUESTIONS[currentIdx];
          const isCorrect = choice === q.answer;
          if (isCorrect) score++;

          records.push({
            num: currentIdx + 1,
            shortName: q.shortName,
            answerLabel: q.answerLabel,
            isCorrect
          });

          document.getElementById('quizScorePill').textContent = `目前得分：${score} / ${QUESTIONS.length}`;

          document.querySelectorAll('.quiz-opt-btn').forEach((btn) => {
            btn.disabled = true;
            if (btn.dataset.choice === q.answer) btn.classList.add('correct');
            else if (btn.dataset.choice === choice && !isCorrect) btn.classList.add('wrong');
          });

          const fb = document.getElementById('quizFeedback');
          fb.classList.add('show', isCorrect ? 'ok' : 'err');
          document.getElementById('quizFeedbackTitle').textContent = isCorrect
            ? `✅ 答對了！正確答案是「${q.answerLabel}」`
            : `❌ 再想想看喔！正確答案是「${q.answerLabel}」`;
          document.getElementById('quizFeedbackBody').textContent = q.explanation;
        }

        function nextQuestion() {
          if (currentIdx < QUESTIONS.length - 1) {
            loadQuestion(currentIdx + 1);
          } else {
            showSummary();
          }
        }

        function showSummary() {
          document.getElementById('quizQuestionCard').style.display = 'none';
          const card = document.getElementById('quizSummaryCard');
          card.classList.add('show');
          document.getElementById('summaryScoreText').textContent = `${score} / ${QUESTIONS.length}`;

          const comment = score === QUESTIONS.length
            ? '太棒了！你已經完全掌握混合物、化合物與元素的微觀辨別技巧，連雙原子元素的經典陷阱也完美破解！'
            : (score >= 3
              ? '表現很不錯！建議再特別複習答錯的題目，牢記「先數微粒有幾種，再數每顆微粒有幾種原子」的口訣。'
              : '沒關係，多看幾次微觀動畫會更有感覺！記住：只有一種微粒是純物質；含不同種原子才是化合物喔！');
          document.getElementById('summaryComment').textContent = comment;

          document.getElementById('summaryList').innerHTML = records.map((r) => `
            <div class="summary-item ${r.isCorrect ? 'pass' : 'fail'}">
              <div style="font-weight:800;margin-bottom:2px;">第 ${r.num} 題 ${r.isCorrect ? '✅' : '❌'}</div>
              <div style="color:var(--text-secondary);">${r.shortName}</div>
              <div style="font-weight:700;color:var(--navy-700);margin-top:2px;">正解：${r.answerLabel}</div>
            </div>
          `).join('');
        }

        function restart() {
          score = 0;
          records = [];
          loadQuestion(0);
        }

        function drawFrame(dtRaw) {
          if (state.activeTab !== 'quiz' || !qCtx) return;
          const s = Math.min(dtRaw, 0.05) * 60;
          qCtx.clearRect(0, 0, QW, QH);

          // 微弱實驗網格底紋
          qCtx.save();
          qCtx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
          qCtx.lineWidth = 1;
          for (let gx = 32; gx < QW; gx += 32) {
            qCtx.beginPath(); qCtx.moveTo(gx, 0); qCtx.lineTo(gx, QH); qCtx.stroke();
          }
          for (let gy = 32; gy < QH; gy += 32) {
            qCtx.beginPath(); qCtx.moveTo(0, gy); qCtx.lineTo(QW, gy); qCtx.stroke();
          }
          qCtx.restore();

          qParticles.forEach((p) => {
            p.x += p.vx * s;
            p.y += p.vy * s;
            p.ang += p.va * s;

            const pad = 32;
            if (p.x < pad) { p.x = pad; p.vx = Math.abs(p.vx); }
            if (p.x > QW - pad) { p.x = QW - pad; p.vx = -Math.abs(p.vx); }
            if (p.y < pad) { p.y = pad; p.vy = Math.abs(p.vy); }
            if (p.y > QH - pad) { p.y = QH - pad; p.vy = -Math.abs(p.vy); }

            if (p.shape === 'mono') {
              drawAtom3D(qCtx, p.x, p.y, p.a1, false, 1.15);
            } else if (p.shape === 'di_same') {
              const half = 13.5;
              const x1 = p.x - Math.cos(p.ang) * half;
              const y1 = p.y - Math.sin(p.ang) * half;
              const x2 = p.x + Math.cos(p.ang) * half;
              const y2 = p.y + Math.sin(p.ang) * half;
              drawBondStick(qCtx, x1, y1, x2, y2, '#475569', 5, p.a1 === 'O');
              drawAtom3D(qCtx, x1, y1, p.a1, false, 1.05);
              drawAtom3D(qCtx, x2, y2, p.a1, false, 1.05);
            } else if (p.shape === 'tri_bent') {
              const dist = 17;
              const sp = 0.92;
              const h1x = p.x + Math.cos(p.ang - sp) * dist;
              const h1y = p.y + Math.sin(p.ang - sp) * dist;
              const h2x = p.x + Math.cos(p.ang + sp) * dist;
              const h2y = p.y + Math.sin(p.ang + sp) * dist;
              drawBondStick(qCtx, p.x, p.y, h1x, h1y, '#64748b', 4.5);
              drawBondStick(qCtx, p.x, p.y, h2x, h2y, '#64748b', 4.5);
              drawAtom3D(qCtx, h1x, h1y, p.a2, false, 1.05);
              drawAtom3D(qCtx, h2x, h2y, p.a2, false, 1.05);
              drawAtom3D(qCtx, p.x, p.y, p.a1, false, 1.05);
            }
          });
        }

        return { init, resize, drawFrame };
      })();

      /* ======================================================================
         11. 分頁切換、事件綁定與動畫主迴圈啟動
         ====================================================================== */
      function switchTab(tabName) {
        state.activeTab = tabName;
        stopAutoPlay();

        document.getElementById('tabAnimBtn').classList.toggle('active', tabName === 'animation');
        document.getElementById('tabQuizBtn').classList.toggle('active', tabName === 'quiz');
        document.getElementById('view-animation').classList.toggle('active', tabName === 'animation');
        document.getElementById('view-quiz').classList.toggle('active', tabName === 'quiz');

        if (tabName === 'animation') {
          requestAnimationFrame(() => MicroSim.resize());
        } else {
          requestAnimationFrame(() => QuizModule.resize());
        }
      }

      function bindGlobalEvents() {
        document.getElementById('tabAnimBtn').addEventListener('click', () => switchTab('animation'));
        document.getElementById('tabQuizBtn').addEventListener('click', () => switchTab('quiz'));

        // 時間軸點擊
        document.querySelectorAll('.step-pill').forEach((btn) => {
          btn.addEventListener('click', () => {
            stopAutoPlay();
            goToStage(Number(btn.dataset.step));
          });
        });

        // 播放列按鈕
        document.getElementById('btnAutoPlay').addEventListener('click', toggleAutoPlay);
        document.getElementById('btnPrev').addEventListener('click', () => {
          stopAutoPlay();
          goToStage(state.stage - 1);
        });
        document.getElementById('btnNext').addEventListener('click', () => {
          stopAutoPlay();
          goToStage(state.stage + 1);
        });
        document.getElementById('btnReplay').addEventListener('click', () => {
          stopAutoPlay();
          goToStage(state.stage);
        });

        // 微觀顯示開關
        document.getElementById('chkSymbols').addEventListener('change', (e) => {
          state.showSymbols = e.target.checked;
        });
        document.getElementById('chkSlowMo').addEventListener('change', (e) => {
          state.slowMo = e.target.checked;
        });

        // 支援鍵盤左右方向鍵切換步驟，方便簡報筆操作
        window.addEventListener('keydown', (e) => {
          if (state.activeTab !== 'animation') return;
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
          if (e.key === 'ArrowRight' && state.stage < 4) {
            stopAutoPlay();
            goToStage(state.stage + 1);
          } else if (e.key === 'ArrowLeft' && state.stage > 0) {
            stopAutoPlay();
            goToStage(state.stage - 1);
          }
        });
      }

      // 主 60fps 動畫迴圈
      let lastTimestamp = 0;
      function mainLoop(ts) {
        try {
          if (!lastTimestamp) lastTimestamp = ts;
          const dt = (ts - lastTimestamp) / 1000;
          lastTimestamp = ts;

          if (state.activeTab === 'animation') {
            MicroSim.stepAndDraw(dt);
          } else {
            QuizModule.drawFrame(dt);
          }
        } catch (err) {
          console.error('Animation frame error:', err);
        }
        requestAnimationFrame(mainLoop);
      }

      // 於頁面載入完成後啟動所有模組
      window.onload = function () {
        try {
          MicroSim.initCanvas();
          QuizModule.init();
          bindGlobalEvents();
          goToStage(0);
          requestAnimationFrame(mainLoop);
        } catch (err) {
          console.error('App initialization error:', err);
        }
      };
    })();
  </script>
</body>
</html>
