<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物質的分類與變化：從混合物到元素的微觀之旅</title>
  <meta name="description" content="國高中理化巨微觀雙視窗互動模擬：從混合物過濾與結晶（物理變化），到純物質化合物分解成元素（化學變化），並內建 5 題微觀粒子隨堂測驗。" />
  <meta name="portal-tags" content="化學, 物質分類, 混合物與純物質, 物理化學變化" />
  <meta name="portal-badge" content="互動教材 + 測驗" />
  <meta name="portal-featured" content="true" />
  <style>
    /* ==========================================================================
       全域設計變數與現代科學實驗室風格 (Light Theme, High Contrast for Projectors)
       ========================================================================== */
    :root {
      --bg-page: #f0f4f8;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border-light: #e2e8f0;
      --border-med: #cbd5e1;

      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --navy-700: #1e3a8a;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #e0f2fe;
      --teal: #0d9488;
      --teal-light: #ccfbf1;
      --amber: #d97706;
      --amber-light: #fef3c7;
      --rose: #e11d48;
      --rose-light: #ffe4e6;
      --purple: #7c3aed;
      --purple-light: #ede9fe;
      --emerald: #059669;
      --emerald-light: #d1fae5;

      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --font-sans: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ==========================================================================
       整體版面架構 (桌面版一屏呈現，行動版平滑響應)
       ========================================================================== */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1600px;
      margin: 0 auto;
      padding: 10px 14px 14px;
      gap: 10px;
    }

    @media (min-width: 1120px) {
      .app-shell {
        height: 100vh;
        overflow: hidden;
      }
    }

    /* --- 頂部標題與分頁列 --- */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #0369a1 100%);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: clamp(1rem, 1.45vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.25;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: #bae6fd;
      font-weight: 500;
    }

    .nav-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.35);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      gap: 4px;
    }

    .nav-tab-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-tab-btn.active {
      background: #ffffff;
      color: var(--navy-700);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }

    /* ==========================================================================
       教學動畫主視圖
       ========================================================================== */
    .view-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .view-panel.active {
      display: flex;
    }

    /* --- 互動式步驟時間軸與播放控制 --- */
    .timeline-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .steps-track {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 280px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .step-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 10px;
      border: 1.5px solid var(--border-light);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .step-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #f0f9ff;
    }

    .step-pill .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--border-light);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      transition: all 0.2s ease;
    }

    .step-pill.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--navy-700);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.16);
    }

    .step-pill.active .step-num {
      background: var(--primary);
      color: #ffffff;
    }

    .step-pill.completed .step-num {
      background: var(--teal);
      color: #ffffff;
    }

    .step-arrow {
      color: #94a3b8;
      font-size: 0.85rem;
      user-select: none;
      flex-shrink: 0;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-med);
      background: #ffffff;
      color: var(--navy-800);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: var(--primary);
      color: var(--primary);
    }

    .ctrl-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, #0284c7, #0d9488);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.28);
    }

    .ctrl-btn.primary:hover:not(:disabled) {
      filter: brightness(1.06);
      color: #ffffff;
    }

    .ctrl-btn.playing {
      background: linear-gradient(135deg, #ea580c, #d97706);
      border-color: transparent;
      color: #ffffff;
    }

    /* --- 主工作區：左雙視窗 × 右側資訊欄 --- */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    @media (min-width: 1120px) {
      .workspace-grid {
        grid-template-columns: minmax(0, 1.85fr) minmax(320px, 1fr);
      }
    }

    /* --- 左側：巨觀 × 微觀雙視窗 --- */
    .visual-stage {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .dual-windows {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    @media (min-width: 768px) {
      .dual-windows {
        grid-template-columns: minmax(220px, 0.62fr) minmax(0, 1.38fr);
      }
    }

    .lab-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 13px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--navy-900);
    }

    .title-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--primary);
    }

    .title-dot.teal { background: var(--teal); }
    .title-dot.amber { background: var(--amber); }
    .title-dot.purple { background: var(--purple); }

    /* --- 巨觀實驗視窗 --- */
    .macro-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #f1f5f9 100%);
      position: relative;
      min-height: 260px;
    }

    .macro-svg-wrap {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .macro-svg-wrap svg {
      width: 100%;
      height: 100%;
      max-height: 360px;
      display: block;
    }

    .macro-caption {
      width: 100%;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy-800);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-light);
      padding: 6px 10px;
      border-radius: 9px;
      margin-top: 6px;
    }

    /* --- 微觀原子分子視窗 --- */
    .micro-toggles {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      background: #ffffff;
      border: 1px solid var(--border-med);
      padding: 4px 9px;
      border-radius: 999px;
      transition: all 0.15s ease;
    }

    .toggle-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .toggle-chip input {
      accent-color: var(--primary);
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    .micro-canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 300px;
      background: linear-gradient(180deg, #f8fbff 0%, #eef5fb 100%);
      overflow: hidden;
    }

    #microCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* --- 階段專屬互動控制列 (置於雙視窗下方) --- */
    .stage-action-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      flex-shrink: 0;
      min-height: 54px;
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }

    .action-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn-lg {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .action-btn-lg:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .action-btn-lg:active {
      transform: translateY(0);
    }

    .action-btn-lg.heat {
      background: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
      box-shadow: 0 3px 10px rgba(220, 38, 38, 0.28);
    }

    .action-btn-lg.light {
      background: linear-gradient(135deg, #7c3aed 0%, #d97706 100%);
      box-shadow: 0 3px 10px rgba(124, 58, 237, 0.28);
    }

    .action-btn-lg.done {
      background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
      box-shadow: 0 3px 10px rgba(13, 148, 136, 0.25);
    }

    /* 化合物切換開關 */
    .compound-switcher {
      display: inline-flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      gap: 3px;
    }

    .compound-opt {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .compound-opt.active {
      background: #ffffff;
      color: var(--navy-700);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
    }

    /* 能量滑桿組件 */
    .energy-slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      padding: 5px 12px;
      border-radius: 10px;
      flex: 1;
      min-width: 210px;
      max-width: 360px;
    }

    .energy-slider-group label {
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      color: var(--navy-800);
    }

    .energy-slider {
      flex: 1;
      accent-color: #ef4444;
      cursor: pointer;
      height: 6px;
    }

    .energy-slider.uv-mode {
      accent-color: #7c3aed;
    }

    .energy-val {
      font-size: 0.82rem;
      font-weight: 800;
      min-width: 38px;
      text-align: right;
      color: var(--navy-900);
    }

    .equation-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fffbeb;
      border: 1.5px solid #fcd34d;
      color: #92400e;
      padding: 5px 12px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .equation-badge.uv {
      background: #f5f3ff;
      border-color: #c4b5fd;
      color: #5b21b6;
    }

    .stage-status-hint {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* ==========================================================================
       右側資訊面板 (概念樹、觀念卡、圖例)
       ========================================================================== */
    .info-sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    @media (min-width: 1120px) {
      .info-sidebar {
        overflow-y: auto;
        padding-right: 2px;
      }
    }

    /* --- 物質分類概念樹 --- */
    .tree-box {
      padding: 8px 10px 6px;
      background: #ffffff;
    }

    .tree-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .tree-node rect {
      transition: all 0.3s ease;
    }

    .tree-node text {
      transition: all 0.3s ease;
      font-family: var(--font-sans);
    }

    .tree-node.active rect {
      stroke-width: 2.8px;
      filter: drop-shadow(0 0 6px rgba(2, 132, 199, 0.35));
    }

    .tree-arrow {
      transition: all 0.3s ease;
    }

    .tree-arrow.active {
      stroke-width: 2.8px;
      animation: pulseDash 1.1s linear infinite;
    }

    @keyframes pulseDash {
      from { stroke-dashoffset: 16; }
      to { stroke-dashoffset: 0; }
    }

    /* --- 本階段核心觀念卡 --- */
    .concept-body {
      padding: 10px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .badge-phys { background: var(--primary-light); color: #0369a1; border-color: #bae6fd; }
    .badge-chem { background: var(--rose-light); color: #be123c; border-color: #fecdd3; }
    .badge-neutral { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }
    .badge-teal { background: var(--teal-light); color: #0f766e; border-color: #99f6e4; }
    .badge-amber { background: var(--amber-light); color: #b45309; border-color: #fde68a; }

    .concept-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .concept-list li {
      position: relative;
      padding-left: 16px;
      font-size: 0.83rem;
      color: var(--navy-800);
      line-height: 1.48;
    }

    .concept-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
    }

    .concept-list li strong {
      color: var(--navy-900);
    }

    .concept-highlight-box {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 7px 10px;
      border-radius: 0 8px 8px 0;
      font-size: 0.8rem;
      color: #78350f;
      font-weight: 700;
      line-height: 1.45;
    }

    /* --- 圖例 (Legend) --- */
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      padding: 9px 11px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 9px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      transition: all 0.2s ease;
    }

    .legend-item.highlight {
      background: #f0f9ff;
      border-color: #7dd3fc;
      box-shadow: 0 1px 4px rgba(2, 132, 199, 0.12);
    }

    .legend-icon {
      width: 34px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .legend-text {
      min-width: 0;
    }

    .legend-name {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.2;
    }

    .legend-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.2;
    }

    /* ==========================================================================
       微觀粒子隨堂測驗視圖
       ========================================================================== */
    .quiz-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 12px;
    }

    .quiz-top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      box-shadow: var(--shadow-sm);
    }

    .quiz-progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 220px;
    }

      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

      border-radius: 999px;
      transition: width 0.35s ease;

    .quiz-score-pill {

      color: #065f46;
      border: 1px solid #6ee7b7;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 800;

      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);

      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: center;

        grid-template-columns: 1.05fr 1fr;
      }
    }

      width: 100%;
      aspect-ratio: 4 / 3;

      border-radius: var(--radius-md);
      overflow: hidden;

      width: 100%;
      height: 100%;
      display: block;
    }

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

      font-weight: 800;
      color: var(--navy-900);
    }

      color: var(--text-secondary);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-opt-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-radius: 12px;
      border: 2px solid var(--border-light);
      background: var(--bg-subtle);
      color: var(--navy-900);
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
    }

    .quiz-opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f0f9ff;
      transform: translateX(3px);
    }

    .quiz-opt-btn:disabled {
      cursor: default;
    }

    .quiz-opt-btn.correct {
      background: var(--emerald-light);
      border-color: var(--emerald);
      color: #064e3b;
    }

    .quiz-opt-btn.wrong {
      background: var(--rose-light);
      border-color: var(--rose);
      color: #881337;
    }

    .quiz-opt-sub {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .quiz-feedback {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.55;
      border: 1.5px solid transparent;
    }

    .quiz-feedback.show {
      display: block;
    }

    .quiz-feedback.ok {
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #065f46;
    }

    .quiz-feedback.err {
      background: #fff1f2;
      border-color: #fda4af;
      color: #9f1239;
    }

    .quiz-feedback-title {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .quiz-next-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .quiz-summary-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 26px 24px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    }

    .summary-score-big {

      font-weight: 900;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .summary-list {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      text-align: left;
    }

    .summary-item {

      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: var(--bg-subtle);
      font-size: 0.82rem;
    }

    .summary-item.pass { border-left: 4px solid var(--emerald); }
    .summary-item.fail { border-left: 4px solid var(--rose); }

    /* 輔助小動畫 */
    @keyframes floatUp {
      0% { transform: translateY(4px); opacity: 0.15; }
      50% { opacity: 0.85; }
      100% { transform: translateY(-14px); opacity: 0; }

      /**
       * 在 Canvas 上繪製具有立體高光與陰影的 3D 原子球體
       */
      function drawAtom3D(ctx, x, y, type, showSymbol, scale = 1, alpha = 1) {
        const spec = ATOM_STYLES[type] || ATOM_STYLES.O;
        const r = spec.r * scale;

        ctx.save();
        ctx.globalAlpha = alpha;

        // 柔和投影增強立體層次
        ctx.beginPath();
        ctx.arc(x + 1.5 * scale, y + 2.5 * scale, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.14)';
        ctx.fill();

        // 3D 放射狀漸層球體
        const grad = ctx.createRadialGradient(
          x - r * 0.34, y - r * 0.34, r * 0.1,
          x, y, r
        );
        grad.addColorStop(0, spec.light);
        grad.addColorStop(0.45, spec.base);
        grad.addColorStop(1, spec.dark);

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // 外框線（白色/淺銀色原子在淺色背景上保持高對比）
        ctx.lineWidth = spec.stroke ? 1.4 : 0.9;
        ctx.strokeStyle = spec.stroke || 'rgba(15, 23, 42, 0.25)';
        ctx.stroke();

        // 左上角高光點
        ctx.beginPath();
        ctx.ellipse(x - r * 0.32, y - r * 0.34, r * 0.25, r * 0.15, -Math.PI / 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.52)';
        ctx.fill();

        // 原子符號標記
        if (showSymbol) {
          const fontSize = Math.max(8, Math.round(r * (spec.symbol.length > 1 ? 0.85 : 1.02)));
          ctx.font = `800 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = spec.text;
          ctx.fillText(spec.symbol, x, y + 0.5);
        }
        ctx.restore();
      }

      /**
       * 繪製兩原子間的化學鍵結棒
       */
      function drawBondStick(ctx, x1, y1, x2, y2, color = '#64748b', width = 5, doubleBond = false) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        if (!doubleBond) {
          ctx.lineWidth = width;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        } else {
          const dx = x2 - x1;
          const dy = y2 - y1;
          const len = Math.hypot(dx, dy) || 1;
          const nx = (-dy / len) * 3.4;
          const ny = (dx / len) * 3.4;
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.moveTo(x1 + nx, y1 + ny);
          ctx.lineTo(x2 + nx, y2 + ny);
          ctx.moveTo(x1 - nx, y1 - ny);
          ctx.lineTo(x2 - nx, y2 - ny);
          ctx.stroke();
        }
        ctx.restore();
      }

      /**
       * 繪製圓角矩形文字標籤，避免文字模糊或與背景重疊
       */
      function drawPillLabel(ctx, text, cx, cy, options = {}) {
        const {
          bg = 'rgba(255, 255, 255, 0.94)',
          border = '#0284c7',
          color = '#0f172a',
          fontSize = 13,
          paddingX = 12,
          paddingY = 6
        } = options;

        ctx.save();
        ctx.font = `800 ${fontSize}px "PingFang TC", "Microsoft JhengHei", sans-serif`;
        const textWidth = ctx.measureText(text).width;
        const w = textWidth + paddingX * 2;
        const h = fontSize + paddingY * 2;
        const x = cx - w / 2;
        const y = cy - h / 2;

        ctx.beginPath();
        roundRectPath(ctx, x, y, w, h, h / 2);
        ctx.fillStyle = bg;
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = border;
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, cx, cy + 0.5);
        ctx.restore();
      }

      function roundRectPath(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function updateConceptTree() {
        const info = STAGE_INFO[state.stage];
        const activeNodes = new Set(info.treeNodes);
        const activeArrows = new Set(info.treeArrows);

        // 動態判斷：在階段二開始過濾前僅高亮混合物；過濾中/完成高亮混合物與純物質
        if (state.stage === 1 && state.filterProgress < 0.05) {
          activeNodes.clear();
          activeNodes.add('mixture');
        }
        // 階段五尚未達分解門檻前，主要高亮化合物；開始分解後同時高亮化學方法與元素
        if (state.stage === 4 && state.energy < 20 && !state.decomposed) {
          activeNodes.clear();
          activeNodes.add('pure');
          activeNodes.add('compound');
          activeArrows.clear();
        }

        const nodeStyles = {
          mixture:  { fill: '#fef3c7', stroke: '#d97706', txt: '#92400e' },
          pure:     { fill: '#e0f2fe', stroke: '#0284c7', txt: '#0369a1' },
          compound: { fill: '#ede9fe', stroke: '#7c3aed', txt: '#5b21b6' },
          element:  { fill: '#d1fae5', stroke: '#059669', txt: '#065f46' }
        };

        ['mixture', 'pure', 'compound', 'element'].forEach((key) => {
          const g = document.getElementById(`node-${key}`);
          if (!g) return;
          const rect = g.querySelector('rect');
          const texts = g.querySelectorAll('text');
          const isActive = activeNodes.has(key);
          g.classList.toggle('active', isActive);
          if (isActive) {
            rect.setAttribute('fill', nodeStyles[key].fill);
            rect.setAttribute('stroke', nodeStyles[key].stroke);
            texts[0].setAttribute('fill', nodeStyles[key].txt);
          } else {
            rect.setAttribute('fill', '#f8fafc');
            rect.setAttribute('stroke', '#cbd5e1');
            texts[0].setAttribute('fill', '#64748b');
          }
        });

        // 物理方法箭頭
        const physLine = document.getElementById('arrow-phys');
        const physBg = document.getElementById('label-phys-bg');
        const physTxt = document.getElementById('label-phys-txt');
        const physOn = activeArrows.has('phys');
        physLine.classList.toggle('active', physOn);
        physLine.setAttribute('stroke', physOn ? '#0284c7' : '#cbd5e1');
        physLine.setAttribute('marker-start', physOn ? 'url(#arrowBlue)' : 'url(#arrowGray)');
        physLine.setAttribute('marker-end', physOn ? 'url(#arrowBlue)' : 'url(#arrowGray)');
        physBg.setAttribute('fill', physOn ? '#e0f2fe' : '#f1f5f9');
        physTxt.setAttribute('fill', physOn ? '#0369a1' : '#64748b');

        // 化學方法箭頭
        const chemLine = document.getElementById('arrow-chem');
        const chemBg = document.getElementById('label-chem-bg');
        const chemTxt = document.getElementById('label-chem-txt');
        const chemOn = activeArrows.has('chem');
        chemLine.classList.toggle('active', chemOn);
        chemLine.setAttribute('stroke', chemOn ? '#e11d48' : '#cbd5e1');
        chemLine.setAttribute('marker-start', chemOn ? 'url(#arrowRose)' : 'url(#arrowGray)');
        chemLine.setAttribute('marker-end', chemOn ? 'url(#arrowRose)' : 'url(#arrowGray)');
        chemBg.setAttribute('fill', chemOn ? '#ffe4e6' : '#f1f5f9');
        chemTxt.setAttribute('fill', chemOn ? '#be123c' : '#64748b');
      }

         7. 階段專屬操作控制列渲染
         ====================================================================== */
      function renderStageActionBar() {

        if (state.stage === 0) {

            goToStage(1);
          });

            }

              MicroSim.initStage(2);
              state.evapRunning = true;
            } else {
              state.evapRunning = true;
            }
            renderStageActionBar();
          });
          const nextBtn = document.getElementById('btnNextFromEvap');
          if (nextBtn) {
            nextBtn.addEventListener('click', () => {
              stopAutoPlay();

            });

        } else if (state.stage === 3) {
          const isHgO = state.compound === 'HgO';

            <div class="action-left">
              <span style="font-size:0.84rem;font-weight:800;color:var(--navy-900);">選擇經典化合物實例：</span>

                <button class="compound-opt ${isHgO ? 'active' : ''}" data-comp="HgO" type="button">實例 A：氧化汞 HgO（加熱分解）</button>
                <button class="compound-opt ${!isHgO ? 'active' : ''}" data-comp="AgCl" type="button">實例 B：氯化銀 AgCl（照光分解）</button>

            btn.addEventListener('click', () => {

              updateInfoPanels();

          document.getElementById('btnGoDecomp').addEventListener('click', () => {
            stopAutoPlay();
            goToStage(4);
          });

          // Stage 5: 化學分解
          const isHgO = state.compound === 'HgO';
          const eqText = isHgO ? '2HgO —(加熱)→ 2Hg + O₂↑' : '2AgCl —(照光)→ 2Ag + Cl₂↑';

          const btnLabel = state.decomposed
            ? '↻ 重置重新分解'
            : (state.energyAutoRamp ? '⏸ 暫停加能' : (isHgO ? '🔥 酒精燈持續加熱' : '☀️ 開啟強光／紫外線照射'));

          bar.innerHTML = `

              updateInfoPanels();
              updateConceptTree();
              renderStageActionBar();
            });

          const slider = document.getElementById('energySlider');
          const valTxt = document.getElementById('energyValText');
          slider.addEventListener('input', (ev) => {
            stopAutoPlay();
            state.energyAutoRamp = false;
            state.energy = Number(ev.target.value);
            valTxt.textContent = `${Math.round(state.energy)}%`;
            if (state.energy >= 62 && !state.decomposed) {
              MicroSim.triggerChemicalBondBreak();
            }
            renderMacroSVG();
            updateConceptTree();
          });

          document.getElementById('btnTriggerEnergy').addEventListener('click', () => {
            stopAutoPlay();
            if (state.decomposed && state.decomposeProgress >= 0.95) {
              MicroSim.initStage(4);
              state.energyAutoRamp = true;
            } else {
              state.energyAutoRamp = !state.energyAutoRamp;
            }
            renderStageActionBar();
          });
        }
      }

      /* ======================================================================
         8. 微觀 60fps HTML5 Canvas 粒子模擬引擎
         ====================================================================== */
      const MicroSim = (function () {
        let canvas, ctx;
        let W = 600, H = 400;
        let particles = [];
        let sparks = [];
        let photons = [];
        let time = 0;

        function initCanvas() {
          canvas = document.getElementById('microCanvas');
          ctx = canvas.getContext('2d');
          resize();
          if (typeof ResizeObserver !== 'undefined') {
            const ro = new ResizeObserver(() => resize());
            ro.observe(document.getElementById('microCanvasWrap'));
          }
          window.addEventListener('resize', resize);
        }

        function resize() {
          if (!canvas) return;
          const wrap = document.getElementById('microCanvasWrap');
          const rect = wrap.getBoundingClientRect();
          if (rect.width < 10 || rect.height < 10) return;
          const prevW = W;
          const prevH = H;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = rect.width;
          H = rect.height;
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          if (prevW > 0 && prevH > 0 && particles.length > 0 && (Math.abs(W - prevW) > 6 || Math.abs(H - prevH) > 6)) {
            const sx = W / prevW;
            const sy = H / prevH;
            particles.forEach((p) => {
              if (typeof p.x === 'number') p.x *= sx;
              if (typeof p.y === 'number') p.y *= sy;
              if (typeof p.baseX === 'number') p.baseX *= sx;
              if (typeof p.baseY === 'number') p.baseY *= sy;
              if (typeof p.targetX === 'number') p.targetX *= sx;
              if (typeof p.targetY === 'number') p.targetY *= sy;
              if (typeof p.metalTargetX === 'number') p.metalTargetX *= sx;
              if (typeof p.metalTargetY === 'number') p.metalTargetY *= sy;
              if (typeof p.gasTargetX === 'number') p.gasTargetX *= sx;
              if (typeof p.gasTargetY === 'number') p.gasTargetY *= sy;
            });
          }
        }

        // 工具：隨機範圍
        const rand = (min, max) => min + Math.random() * (max - min);

        /**
         * 初始化指定階段的粒子分布
         */
        function initStage(stageIdx) {
          particles = [];
          sparks = [];
          photons = [];
          state.filterRunning = false;
          state.filterProgress = 0;
          state.evapRunning = false;
          state.evapProgress = 0;
          state.energy = 0;
          state.energyAutoRamp = false;
          state.decomposed = false;
          state.decomposeProgress = 0;

          const padX = 48;
          const padY = 58;

          if (stageIdx === 0) {
            // 階段一：混合物 (H2O + NaCl + HgO 大團塊)
            for (let i = 0; i < 11; i++) {
              particles.push({
                kind: 'H2O',
                x: rand(padX, W - padX),
                y: rand(padY, H - padY),
                vx: rand(-1.35, 1.35),
                vy: rand(-1.35, 1.35),
                angle: rand(0, Math.PI * 2),
                va: rand(-0.025, 0.025)
              });
            }
            for (let i = 0; i < 6; i++) {
              particles.push({
                kind: 'NaCl',
                x: rand(padX, W - padX),
                y: rand(padY, H - padY),
                vx: rand(-1.05, 1.05),
                vy: rand(-1.05, 1.05),
                angle: rand(0, Math.PI * 2),
                va: rand(-0.02, 0.02)
              });
            }
            for (let i = 0; i < 4; i++) {
              particles.push({
                kind: 'HgO_cluster',
                x: rand(90, W - 90),
                y: rand(95, H - 70),
                vx: rand(-0.42, 0.42),
                vy: rand(-0.35, 0.35),
                angle: rand(0, Math.PI * 2),
                va: rand(-0.008, 0.008)
              });
            }
          } else if (stageIdx === 1) {
            // 階段二：過濾（初始全在濾紙上方）
            const topMaxY = H * 0.42;
            for (let i = 0; i < 11; i++) {
              particles.push({
                kind: 'H2O',
                x: rand(44, W - 44),
                y: rand(52, topMaxY),
                vx: rand(-1.1, 1.1),
                vy: rand(-0.8, 0.8),
                angle: rand(0, Math.PI * 2),
                va: rand(-0.025, 0.025),
                passed: false,
                passDelay: rand(0.05, 0.72)
              });
            }
            for (let i = 0; i < 6; i++) {
              particles.push({
                kind: 'NaCl',
                x: rand(50, W - 50),
                y: rand(54, topMaxY),
                vx: rand(-0.9, 0.9),
                vy: rand(-0.7, 0.7),
                angle: rand(0, Math.PI * 2),
                va: rand(-0.02, 0.02),
                passed: false,
                passDelay: rand(0.12, 0.8)
              });
            }
            const clusterXs = [0.22, 0.42, 0.62, 0.8];
            for (let i = 0; i < 4; i++) {
              particles.push({
                kind: 'HgO_cluster',
                x: W * clusterXs[i],
                y: rand(68, topMaxY - 18),
                vx: rand(-0.28, 0.28),
                vy: rand(-0.2, 0.2),
                angle: rand(-0.3, 0.3),
                va: rand(-0.005, 0.005),
                trapped: false
              });
            }
          } else if (stageIdx === 2) {
            // 階段三：蒸發結晶（下方液體區有 H2O 與 NaCl）
            const liqTop = H * 0.50;
            for (let i = 0; i < 12; i++) {
              particles.push({
                kind: 'H2O',
                x: rand(48, W - 48),
                y: rand(liqTop + 18, H - 36),
                vx: rand(-1.1, 1.1),
                vy: rand(-0.9, 0.9),
                angle: rand(0, Math.PI * 2),
                va: rand(-0.025, 0.025),
                evaporated: false,
                evapThreshold: 0.08 + (i / 12) * 0.78
              });
            }
            // 8 個食鹽微粒將整齊排列成 4x2 晶格
            const cols = 4;
            const rows = 2;
            const cellW = 54;
            const cellH = 30;
            const startX = W / 2 - ((cols - 1) * cellW) / 2;
            const startY = H - 72;
            for (let idx = 0; idx < 8; idx++) {
              const r = Math.floor(idx / cols);
              const c = idx % cols;
              particles.push({
                kind: 'NaCl',
                x: rand(60, W - 60),
                y: rand(liqTop + 26, H - 38),
                vx: rand(-0.85, 0.85),
                vy: rand(-0.65, 0.65),
                angle: rand(0, Math.PI * 2),
                va: rand(-0.02, 0.02),
                targetX: startX + c * cellW,
                targetY: startY + r * cellH,
                flip: (r + c) % 2 === 1 // 交錯排列呈現 Na-Cl-Na-Cl 規則晶格
              });
            }
          } else if (stageIdx === 3) {
            // 階段四：純物質 — 化合物（HgO 或 AgCl，整齊單一微粒）
            const cols = 4;
            const rows = 2;
            const spanX = Math.min(W - 140, 380);
            const spanY = Math.min(H - 180, 130);
            const sx = W / 2 - spanX / 2;
            const sy = H / 2 - spanY / 2 + 8;
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                const bx = sx + (c / (cols - 1)) * spanX;
                const by = sy + (r / (rows - 1)) * spanY;
                particles.push({
                  kind: state.compound,
                  baseX: bx,
                  baseY: by,
                  x: bx,
                  y: by,
                  phase: rand(0, Math.PI * 2),
                  angle: (r + c) % 2 === 0 ? -0.18 : 0.18
                });
              }
            }
          } else if (stageIdx === 4) {
            // 階段五：化學分解成元素（6 組化合物分子 -> 6 顆金屬原子 + 3 顆雙原子氣體分子）
            const count = 6;
            const marginX = Math.max(70, W * 0.14);
            const stepX = (W - marginX * 2) / (count - 1);
            for (let i = 0; i < count; i++) {
              const bx = marginX + i * stepX;
              const by = H * 0.56 + (i % 2 === 0 ? -24 : 24);
              particles.push({
                kind: 'compound_decomp',
                pairIndex: Math.floor(i / 2), // 0, 1, 2 (兩兩配對形成 O2 或 Cl2)
                isLeftOfPair: i % 2 === 0,
                baseX: bx,
                baseY: by,
                // 金屬原子位置 (Hg / Ag)
                mx: bx - 14,
                my: by,
                mvx: 0,
                mvy: 0,
                // 非金屬原子位置 (O / Cl)
                nx: bx + 14,
                ny: by,
                nvx: 0,
                nvy: 0,
                // 目標聚集位置
                metalTargetX: W * (0.24 + (i / (count - 1)) * 0.52),
                metalTargetY: H * 0.77 + (i % 2 === 0 ? -12 : 12),
                gasTargetX: W * (0.26 + Math.floor(i / 2) * 0.24),
                gasTargetY: H * 0.28 + (Math.floor(i / 2) % 2 === 0 ? -8 : 14),
                phase: rand(0, Math.PI * 2)
              });
            }
          }
        }

        /**
         * 觸發階段五化學鍵斷裂閃光特效
         */
        function triggerChemicalBondBreak() {
          if (state.decomposed) return;
          state.decomposed = true;
          state.decomposeProgress = 0.01;
          particles.forEach((p) => {
            if (p.kind === 'compound_decomp') {
              sparks.push({
                x: (p.mx + p.nx) / 2,
                y: (p.my + p.ny) / 2,
                r: 4,
                maxR: 34,
                alpha: 1,
                color: state.compound === 'HgO' ? '#f97316' : '#a855f7'
              });
            }
          });
          updateConceptTree();
          renderStageActionBar();
        }

        /* --------------------------------------------------------------------
           繪製各類分子的輔助函式
           -------------------------------------------------------------------- */
        function drawH2O(x, y, angle) {
          const ox = x;
          const oy = y;
          const dist = 16;
          const halfSpread = 0.92; // ~105° 夾角
          const h1x = ox + Math.cos(angle - halfSpread) * dist;
          const h1y = oy + Math.sin(angle - halfSpread) * dist;
          const h2x = ox + Math.cos(angle + halfSpread) * dist;
          const h2y = oy + Math.sin(angle + halfSpread) * dist;

          drawBondStick(ctx, ox, oy, h1x, h1y, '#94a3b8', 4.5);
          drawBondStick(ctx, ox, oy, h2x, h2y, '#94a3b8', 4.5);
          drawAtom3D(ctx, h1x, h1y, 'H', state.showSymbols);
          drawAtom3D(ctx, h2x, h2y, 'H', state.showSymbols);
          drawAtom3D(ctx, ox, oy, 'O', state.showSymbols);
        }

        function drawNaCl(x, y, angle) {
          const half = 12.5;
          const x1 = x - Math.cos(angle) * half;
          const y1 = y - Math.sin(angle) * half;
          const x2 = x + Math.cos(angle) * half;
          const y2 = y + Math.sin(angle) * half;

          drawBondStick(ctx, x1, y1, x2, y2, '#94a3b8', 5);
          drawAtom3D(ctx, x1, y1, 'Na', state.showSymbols);
          drawAtom3D(ctx, x2, y2, 'Cl', state.showSymbols);
        }

        function drawHgOCluster(x, y, angle) {
          // 4 顆原子緊密結合的較大固體團塊 (2 Hg + 2 O)
          const pts = [
            { type: 'Hg', dx: -14, dy: -10 },
            { type: 'O',  dx: 12,  dy: -11 },
            { type: 'O',  dx: -12, dy: 12 },
            { type: 'Hg', dx: 14,  dy: 11 }
          ];
          const cos = Math.cos(angle);
          const sin = Math.sin(angle);
          const world = pts.map((pt) => ({
            type: pt.type,
            wx: x + pt.dx * cos - pt.dy * sin,
            wy: y + pt.dx * sin + pt.dy * cos
          }));

          // 團塊光暈底圈，凸顯其體積遠大於濾網孔隙
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, 31, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(234, 88, 12, 0.11)';
          ctx.fill();
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = 'rgba(234, 88, 12, 0.45)';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.restore();

          drawBondStick(ctx, world[0].wx, world[0].wy, world[1].wx, world[1].wy, '#64748b', 5);
          drawBondStick(ctx, world[0].wx, world[0].wy, world[2].wx, world[2].wy, '#64748b', 5);
          drawBondStick(ctx, world[3].wx, world[3].wy, world[1].wx, world[1].wy, '#64748b', 5);
          drawBondStick(ctx, world[3].wx, world[3].wy, world[2].wx, world[2].wy, '#64748b', 5);

          world.forEach((w) => drawAtom3D(ctx, w.wx, w.wy, w.type, state.showSymbols, 0.92));
        }

        function drawCompoundUnit(x, y, angle, compType, scale = 1, bondColor = '#64748b') {
          const half = 15 * scale;
          const x1 = x - Math.cos(angle) * half;
          const y1 = y - Math.sin(angle) * half;
          const x2 = x + Math.cos(angle) * half;
          const y2 = y + Math.sin(angle) * half;

          const metal = compType === 'HgO' ? 'Hg' : 'Ag';
          const nonMetal = compType === 'HgO' ? 'O' : 'Cl';

          drawBondStick(ctx, x1, y1, x2, y2, bondColor, 6 * scale);
          drawAtom3D(ctx, x1, y1, metal, state.showSymbols, scale);
          drawAtom3D(ctx, x2, y2, nonMetal, state.showSymbols, scale);
        }

        /* --------------------------------------------------------------------
           主更新與繪製迴圈 (60fps)
           -------------------------------------------------------------------- */
        function stepAndDraw(dtRaw) {
          const speedMul = state.slowMo ? 0.38 : 1.0;
          const dt = Math.min(dtRaw, 0.05) * speedMul;
          const stepScale = dt * 60;
          time += dt;

          // 自動播放排程器
          if (state.autoPlay && state.activeTab === 'animation') {
            handleAutoPlay(dtRaw);
          }

          ctx.clearRect(0, 0, W, H);

          // 依階段執行對應的物理與化學微觀模擬
          if (state.stage === 0) {
            updateAndDrawStage1(stepScale);
          } else if (state.stage === 1) {
            updateAndDrawStage2(dt, stepScale);
          } else if (state.stage === 2) {
            updateAndDrawStage3(dt, stepScale);
          } else if (state.stage === 3) {
            updateAndDrawStage4();
          } else if (state.stage === 4) {
            updateAndDrawStage5(dt, stepScale);
          }
        }

        /* --- 階段一：混合物 --- */
        function updateAndDrawStage1(s) {
          // 柔和液體微觀背景網格
          ctx.save();
          ctx.fillStyle = 'rgba(224, 242, 254, 0.32)';
          ctx.fillRect(0, 0, W, H);
          ctx.restore();

          particles.forEach((p) => {
            const rad = p.kind === 'HgO_cluster' ? 36 : 24;
            p.x += p.vx * s;
            p.y += p.vy * s;
            p.angle += p.va * s;

            if (p.x < rad) { p.x = rad; p.vx = Math.abs(p.vx); }
            if (p.x > W - rad) { p.x = W - rad; p.vx = -Math.abs(p.vx); }
            if (p.y < rad + 32) { p.y = rad + 32; p.vy = Math.abs(p.vy); }
            if (p.y > H - rad - 10) { p.y = H - rad - 10; p.vy = -Math.abs(p.vy); }

            if (p.kind === 'H2O') drawH2O(p.x, p.y, p.angle);
            else if (p.kind === 'NaCl') drawNaCl(p.x, p.y, p.angle);
            else drawHgOCluster(p.x, p.y, p.angle);
          });

          drawPillLabel(ctx, '混合物：同時含有多種不同微粒，彼此混雜但未重新鍵結', W / 2, 24, {
            border: '#d97706', color: '#92400e', bg: 'rgba(255, 251, 235, 0.95)', fontSize: 12.5
          });
        }

        /* --- 階段二：過濾 --- */
        function updateAndDrawStage2(dt, s) {
          const meshY = H * 0.50;

          if (state.filterRunning && state.filterProgress < 1) {
            const prevStep = Math.floor(state.filterProgress * 20);
            state.filterProgress = Math.min(1, state.filterProgress + dt * 0.22);
            const curStep = Math.floor(state.filterProgress * 20);
            if (curStep !== prevStep || state.filterProgress >= 0.99) {
              renderMacroSVG();
              updateConceptTree();
            }
            if (state.filterProgress >= 0.99) {
              state.filterRunning = false;
              renderStageActionBar();
            }
          }

          // 上下區域淡淡色區分
          ctx.save();
          ctx.fillStyle = 'rgba(255, 247, 237, 0.35)';
          ctx.fillRect(0, 0, W, meshY);
          ctx.fillStyle = 'rgba(224, 242, 254, 0.35)';
          ctx.fillRect(0, meshY, W, H - meshY);

          // 繪製濾紙纖維半透網格 (可見孔隙)
          ctx.fillStyle = '#e2e8f0';
          ctx.fillRect(0, meshY - 6, W, 12);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, meshY - 6);
          ctx.lineTo(W, meshY - 6);
          ctx.moveTo(0, meshY + 6);
          ctx.lineTo(W, meshY + 6);
          ctx.stroke();

          // 繪製孔隙通道
          const poreSpacing = 44;
          for (let px = 26; px < W - 20; px += poreSpacing) {
            ctx.fillStyle = '#f0f9ff';
            ctx.fillRect(px, meshY - 7, 22, 14);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px, meshY - 6);
            ctx.lineTo(px, meshY + 6);
            ctx.moveTo(px + 22, meshY - 6);
            ctx.lineTo(px + 22, meshY + 6);
            ctx.stroke();
          }
          ctx.restore();

          // 更新並繪製粒子
          particles.forEach((p) => {
            if (p.kind === 'HgO_cluster') {
              if (state.filterProgress > 0.02) {
                // 向下飄至濾網上方被攔截
                const stopY = meshY - 37;
                if (p.y < stopY) {
                  p.y += 1.45 * s;
                } else {
                  p.y = stopY + Math.sin(time * 4 + p.x) * 1.2;
                  p.trapped = true;
                }
                p.x += p.vx * 0.35 * s;
              } else {
                p.x += p.vx * s;
                p.y += p.vy * s;
                if (p.y > meshY - 40) { p.y = meshY - 40; p.vy = -Math.abs(p.vy); }
                if (p.y < 52) { p.y = 52; p.vy = Math.abs(p.vy); }
              }
              if (p.x < 44) { p.x = 44; p.vx = Math.abs(p.vx); }
              if (p.x > W - 44) { p.x = W - 44; p.vx = -Math.abs(p.vx); }
              drawHgOCluster(p.x, p.y, p.angle);
            } else {
              // H2O 與 NaCl 小分子
              const canPass = state.filterProgress >= p.passDelay;
              p.x += p.vx * s;
              p.angle += p.va * s;

              if (canPass && !p.passed) {
                // 順著水流往下通過濾網孔隙
                p.y += 2.35 * s;
                if (p.y > meshY + 26) {
                  p.passed = true;
                }
              } else {
                p.y += p.vy * s;
                if (!p.passed) {
                  if (p.y < 46) { p.y = 46; p.vy = Math.abs(p.vy); }
                  if (p.y > meshY - 26) { p.y = meshY - 26; p.vy = -Math.abs(p.vy); }
                } else {
                  if (p.y < meshY + 28) { p.y = meshY + 28; p.vy = Math.abs(p.vy); }
                  if (p.y > H - 36) { p.y = H - 36; p.vy = -Math.abs(p.vy); }
                }
              }

              if (p.x < 28) { p.x = 28; p.vx = Math.abs(p.vx); }
              if (p.x > W - 28) { p.x = W - 28; p.vx = -Math.abs(p.vx); }

              if (p.kind === 'H2O') drawH2O(p.x, p.y, p.angle);
              else drawNaCl(p.x, p.y, p.angle);
            }
          });

          // 濾網標籤
          drawPillLabel(ctx, '濾紙纖維網格（小微粒可通過，大團塊被攔截）', W / 2, meshY, {
            border: '#475569', color: '#1e293b', bg: 'rgba(255, 255, 255, 0.96)', fontSize: 11.5, paddingX: 10, paddingY: 4
          });

          // 完成後清楚標示上下區域分類
          if (state.filterProgress > 0.78) {
            drawPillLabel(ctx, '濾渣：純物質（氧化汞 HgO 固體）', W / 2, 24, {
              border: '#ea580c', color: '#9a3412', bg: 'rgba(255, 247, 237, 0.96)', fontSize: 12.5
            });
            drawPillLabel(ctx, '濾液：仍為混合物（水分子 H₂O + 食鹽微粒 NaCl）', W / 2, H - 22, {
              border: '#0284c7', color: '#0369a1', bg: 'rgba(240, 249, 255, 0.96)', fontSize: 12.5
            });
          } else {
            drawPillLabel(ctx, '物理方法：僅依「顆粒大小與溶解度」分離，分子本身完全不變！', W / 2, 24, {
              border: '#0284c7', color: '#0369a1', bg: 'rgba(240, 249, 255, 0.95)', fontSize: 12
            });
          }
        }

        /* --- 階段三：蒸發結晶 --- */
        function updateAndDrawStage3(dt, s) {
          if (state.evapRunning && state.evapProgress < 1) {
            const prevStep = Math.floor(state.evapProgress * 20);
            state.evapProgress = Math.min(1, state.evapProgress + dt * 0.2);
            const curStep = Math.floor(state.evapProgress * 20);
            if (curStep !== prevStep || state.evapProgress >= 0.99) {
              renderMacroSVG();
              updateConceptTree();
            }
            if (state.evapProgress >= 0.99) {
              state.evapRunning = false;
              renderStageActionBar();
            }
          }

          const p = state.evapProgress;
          // 液面隨蒸發緩慢下降
          const waterSurfaceY = H * (0.48 + p * 0.34);

          // 繪製液體區背景（水未完全蒸乾時）
          if (p < 0.96) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(0, waterSurfaceY);
            for (let x = 0; x <= W; x += 24) {
              const wy = waterSurfaceY + Math.sin(x * 0.03 + time * 4) * 3.5;
              ctx.lineTo(x, wy);
            }
            ctx.lineTo(W, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.fillStyle = `rgba(125, 211, 252, ${Math.max(0.05, 0.36 * (1 - p))})`;
            ctx.fill();
            ctx.strokeStyle = `rgba(14, 165, 233, ${Math.max(0.1, 0.7 * (1 - p))})`;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          // 底部溫和加熱紅橘色光暈
          if (state.evapRunning || (p > 0.02 && p < 0.98)) {
            const glow = ctx.createLinearGradient(0, H, 0, H - 70);
            glow.addColorStop(0, 'rgba(249, 115, 22, 0.28)');
            glow.addColorStop(1, 'rgba(249, 115, 22, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, H - 70, W, 70);
          }

          // 若食鹽開始結晶，畫出規則晶格底框提示
          if (p > 0.45) {
            ctx.save();
            ctx.globalAlpha = Math.min(1, (p - 0.45) * 2.2);
            const boxW = 248;
            const boxH = 84;
            const bx = W / 2 - boxW / 2;
            const by = H - 102;
            ctx.beginPath();
            roundRectPath(ctx, bx, by, boxW, boxH, 12);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
            ctx.fill();
            ctx.strokeStyle = '#0d9488';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.restore();
          }

          // 更新與繪製分子
          particles.forEach((pt) => {
            if (pt.kind === 'H2O') {
              const boost = 1 + p * 1.4;
              if (p >= pt.evapThreshold) {
                pt.evaporated = true;
              }
              pt.x += pt.vx * boost * s;
              pt.angle += pt.va * boost * s;

              if (pt.evaporated) {
                // 往上飄散成水蒸氣區
                if (pt.y > H * 0.42) {
                  pt.y -= 2.2 * s;
                } else {
                  pt.y += pt.vy * 1.35 * s;
                  if (pt.y < 48) { pt.y = 48; pt.vy = Math.abs(pt.vy); }
                  if (pt.y > H * 0.42) { pt.y = H * 0.42; pt.vy = -Math.abs(pt.vy); }
                }
              } else {
                pt.y += pt.vy * boost * s;
                const minY = Math.min(H - 50, waterSurfaceY + 18);
                if (pt.y < minY) { pt.y = minY; pt.vy = Math.abs(pt.vy); }
                if (pt.y > H - 28) { pt.y = H - 28; pt.vy = -Math.abs(pt.vy); }
              }

              if (pt.x < 28) { pt.x = 28; pt.vx = Math.abs(pt.vx); }
              if (pt.x > W - 28) { pt.x = W - 28; pt.vx = -Math.abs(pt.vx); }

              drawH2O(pt.x, pt.y, pt.angle);
            } else {
              // NaCl：隨水分減少逐步平滑歸位排列成規則晶格
              if (p > 0.25) {
                const lerp = Math.min(0.12, (p - 0.22) * 0.14) * s;
                pt.x += (pt.targetX - pt.x) * lerp;
                pt.y += (pt.targetY - pt.y) * lerp;
                const targetAngle = pt.flip ? Math.PI : 0;
                pt.angle += (targetAngle - pt.angle) * lerp;
                // 微幅晶格熱振動
                const jx = Math.sin(time * 9 + pt.targetX) * (1 - p) * 1.5;
                const jy = Math.cos(time * 8 + pt.targetY) * (1 - p) * 1.5;
                drawNaCl(pt.x + jx, pt.y + jy, pt.angle);
              } else {
                pt.x += pt.vx * s;
                pt.y += pt.vy * s;
                pt.angle += pt.va * s;
                if (pt.x < 34) { pt.x = 34; pt.vx = Math.abs(pt.vx); }
                if (pt.x > W - 34) { pt.x = W - 34; pt.vx = -Math.abs(pt.vx); }
                if (pt.y < waterSurfaceY + 20) { pt.y = waterSurfaceY + 20; pt.vy = Math.abs(pt.vy); }
                if (pt.y > H - 30) { pt.y = H - 30; pt.vy = -Math.abs(pt.vy); }
                drawNaCl(pt.x, pt.y, pt.angle);
              }
            }
          });

          // 動態教學標註
          if (p > 0.35) {
            drawPillLabel(ctx, '純物質：水蒸氣（H₂O 分子的 H-O 鍵完全不斷裂！）', W / 2, 24, {
              border: '#0284c7', color: '#0369a1', bg: 'rgba(240, 249, 255, 0.96)', fontSize: 12
            });
          } else {
            drawPillLabel(ctx, '物理變化：利用「沸點差異」將食鹽水分離成純水與純食鹽', W / 2, 24, {
              border: '#0284c7', color: '#0369a1', bg: 'rgba(240, 249, 255, 0.95)', fontSize: 12
            });
          }

          if (p > 0.72) {
            drawPillLabel(ctx, '純物質：食鹽晶體（NaCl 規則排列）', W / 2, H - 118, {
              border: '#0d9488', color: '#0f766e', bg: 'rgba(240, 253, 250, 0.96)', fontSize: 12
            });
          }
        }

        /* --- 階段四：純物質 — 化合物 --- */
        function updateAndDrawStage4() {
          const isHgO = state.compound === 'HgO';

          // 柔和純淨背景
          ctx.save();
          ctx.fillStyle = isHgO ? 'rgba(255, 247, 237, 0.32)' : 'rgba(245, 243, 255, 0.34)';
          ctx.fillRect(0, 0, W, H);
          ctx.restore();

          // 放大聚焦框標示其中一顆代表分子
          if (particles.length > 1) {
            const p0 = particles[1];
            ctx.save();
            ctx.beginPath();
            ctx.arc(p0.baseX, p0.baseY, 44, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(124, 58, 237, 0.08)';
            ctx.fill();
            ctx.setLineDash([5, 4]);
            ctx.strokeStyle = '#7c3aed';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          particles.forEach((p) => {
            const ox = Math.sin(time * 2.4 + p.phase) * 3.5;
            const oy = Math.cos(time * 2.1 + p.phase) * 3.5;
            const rot = p.angle + Math.sin(time * 1.6 + p.phase) * 0.08;
            drawCompoundUnit(p.baseX + ox, p.baseY + oy, rot, state.compound, 1.12);
          });

          const nameLabel = isHgO ? '氧化汞（HgO）' : '氯化銀（AgCl）';
          drawPillLabel(ctx, `純物質（化合物）：畫布中只有單一種微粒 — ${nameLabel}`, W / 2, 26, {
            border: '#7c3aed', color: '#5b21b6', bg: 'rgba(245, 243, 255, 0.96)', fontSize: 12.5
          });
          drawPillLabel(ctx, '每一個微粒皆由「兩種不同原子」緊密化合，無法用過濾或結晶分開', W / 2, H - 24, {
            border: '#0d9488', color: '#0f766e', bg: 'rgba(240, 253, 250, 0.96)', fontSize: 12
          });
        }

        /* --- 階段五：化學分解成元素 --- */
        function updateAndDrawStage5(dt, s) {
          const isHgO = state.compound === 'HgO';

          // 若開啟自動升能按鈕，平滑推升能量滑桿
          if (state.energyAutoRamp) {
            state.energy = Math.min(100, state.energy + dt * 28);
            const slider = document.getElementById('energySlider');
            const valTxt = document.getElementById('energyValText');
            if (slider) slider.value = Math.round(state.energy);
            if (valTxt) valTxt.textContent = `${Math.round(state.energy)}%`;

            if (state.energy >= 62 && !state.decomposed) {
              triggerChemicalBondBreak();
            }
            if (state.energy >= 100) {
              state.energyAutoRamp = false;
            }
            renderMacroSVG();
          }

          // 分解進度平滑推進
          if (state.decomposed && state.decomposeProgress < 1) {
            state.decomposeProgress = Math.min(1, state.decomposeProgress + dt * 0.34);
            if (Math.floor(state.decomposeProgress * 15) !== Math.floor((state.decomposeProgress - dt * 0.34) * 15)) {
              renderMacroSVG();
            }
            if (state.decomposeProgress >= 0.99) {
              renderStageActionBar();
            }
          }

          const e = state.energy / 100;
          const dec = state.decomposeProgress;

          // 1. 能量視覺效果（加熱熱波紋 vs 照光紫外線光子束）
          if (e > 0.08 && dec < 0.85) {
            if (isHgO) {
              // 底部加熱波紋
              ctx.save();
              const heatAlpha = Math.min(0.42, e * 0.45) * (1 - dec * 0.7);
              const g = ctx.createLinearGradient(0, H, 0, H * 0.45);
              g.addColorStop(0, `rgba(239, 68, 68, ${heatAlpha})`);
              g.addColorStop(1, 'rgba(249, 115, 22, 0)');
              ctx.fillStyle = g;
              ctx.fillRect(0, H * 0.45, W, H * 0.55);

              // 上升波動熱浪線
              ctx.strokeStyle = `rgba(234, 88, 12, ${heatAlpha * 1.4})`;
              ctx.lineWidth = 2.4;
              for (let i = 0; i < 6; i++) {
                const wx = W * (0.12 + i * 0.15);
                const offset = (time * 90 + i * 40) % 140;
                ctx.beginPath();
                for (let dy = 0; dy <= 55; dy += 6) {
                  const yPos = H - offset - dy;
                  const xPos = wx + Math.sin(dy * 0.22 + time * 12) * 6;
                  if (dy === 0) ctx.moveTo(xPos, yPos);
                  else ctx.lineTo(xPos, yPos);
                }
                ctx.stroke();
              }
              ctx.restore();
            } else {
              // 紫外線／強光斜向光束與光子粒子
              ctx.save();
              const beamAlpha = Math.min(0.28, e * 0.3) * (1 - dec * 0.7);
              const grad = ctx.createLinearGradient(0, 0, W * 0.6, H);
              grad.addColorStop(0, `rgba(250, 204, 21, ${beamAlpha * 1.6})`);
              grad.addColorStop(0.55, `rgba(168, 85, 247, ${beamAlpha})`);
              grad.addColorStop(1, 'rgba(168, 85, 247, 0)');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.moveTo(W * 0.05, 0);
              ctx.lineTo(W * 0.65, 0);
              ctx.lineTo(W, H);
              ctx.lineTo(W * 0.25, H);
              ctx.closePath();
              ctx.fill();

              // 產生飛馳光子 (hν)
              if (Math.random() < e * 0.42) {
                photons.push({
                  x: rand(W * 0.05, W * 0.75),
                  y: -10,
                  vx: 2.2,
                  vy: 4.5,
                  color: Math.random() > 0.5 ? '#eab308' : '#9333ea'
                });
              }
              for (let i = photons.length - 1; i >= 0; i--) {
                const ph = photons[i];
                ph.x += ph.vx * s;
                ph.y += ph.vy * s;
                ctx.beginPath();
                ctx.moveTo(ph.x - 10, ph.y - 20);
                ctx.lineTo(ph.x, ph.y);
                ctx.strokeStyle = ph.color;
                ctx.lineWidth = 2.6;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(ph.x, ph.y, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fef08a';
                ctx.fill();
                if (ph.y > H + 20) photons.splice(i, 1);
              }
              ctx.restore();
            }
          }

          // 2. 分解完成後的「元素對比標籤框」
          if (dec > 0.78) {
            const boxAlpha = Math.min(1, (dec - 0.78) / 0.22);
            ctx.save();
            ctx.globalAlpha = boxAlpha;

            // 上框：雙原子氣體元素 (O2 / Cl2)
            ctx.beginPath();
            roundRectPath(ctx, 22, 46, W - 44, H * 0.36, 14);
            ctx.fillStyle = isHgO ? 'rgba(254, 242, 242, 0.72)' : 'rgba(240, 253, 244, 0.75)';
            ctx.fill();
            ctx.strokeStyle = isHgO ? '#ef4444' : '#16a34a';
            ctx.lineWidth = 2;
            ctx.setLineDash([7, 4]);
            ctx.stroke();

            // 下框：單原子金屬元素 (Hg / Ag)
            ctx.beginPath();
            roundRectPath(ctx, 22, H * 0.54, W - 44, H * 0.34, 14);
            ctx.fillStyle = 'rgba(241, 245, 249, 0.78)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          }

          // 3. 更新並繪製原子與分子
          const metalType = isHgO ? 'Hg' : 'Ag';
          const gasType = isHgO ? 'O' : 'Cl';

          if (!state.decomposed) {
            // 尚未斷鍵：隨能量升高劇烈原地振動，化學鍵發紅/發紫緊繃
            const vibAmp = e > 0.12 ? (e * e) * 11 : 1.5;
            const vibFreq = 12 + e * 38;
            const bondStress = e > 0.35
              ? (isHgO ? '#ef4444' : '#9333ea')
              : '#64748b';

            particles.forEach((p) => {
              const jx = Math.sin(time * vibFreq + p.phase) * vibAmp;
              const jy = Math.cos(time * (vibFreq * 1.15) + p.phase) * vibAmp;
              const stretch = 14 + e * 4.5;
              p.mx = p.baseX - stretch + jx;
              p.my = p.baseY + jy;
              p.nx = p.baseX + stretch + jx;
              p.ny = p.baseY + jy;

              drawBondStick(ctx, p.mx, p.my, p.nx, p.ny, bondStress, 5.5);
              drawAtom3D(ctx, p.mx, p.my, metalType, state.showSymbols);
              drawAtom3D(ctx, p.nx, p.ny, gasType, state.showSymbols);
            });
          } else {
            // 已斷鍵！分階段平滑演進：
            // dec 0~0.35: 原子彈開分離 -> dec 0.35~1.0: 金屬沉降聚集，氣體原子兩兩配對結合成雙原子分子向上飄浮
            particles.forEach((p) => {
              const sepEase = Math.min(1, dec / 0.35);
              const formEase = Math.max(0, Math.min(1, (dec - 0.25) / 0.65));
              const smooth = formEase * formEase * (3 - 2 * formEase);

              // 金屬原子：下沉聚集為單原子元素
              const mFloatX = Math.sin(time * 2.2 + p.phase) * 3;
              const mFloatY = Math.cos(time * 2.5 + p.phase) * 3;
              const startMx = p.baseX - 18 - sepEase * 10;
              const startMy = p.baseY + sepEase * 14;
              p.mx = startMx + (p.metalTargetX - startMx) * smooth + mFloatX;
              p.my = startMy + (p.metalTargetY - startMy) * smooth + mFloatY;

              // 非金屬原子：兩兩配對成 O₂ 或 Cl₂ 向上飄浮
              const pairGap = 13.5;
              const pairFloatX = Math.sin(time * 2.0 + p.pairIndex * 2.1) * 9;
              const pairFloatY = Math.cos(time * 2.3 + p.pairIndex * 1.7) * 6;
              const targetNx = p.gasTargetX + (p.isLeftOfPair ? -pairGap : pairGap) + pairFloatX;
              const targetNy = p.gasTargetY + pairFloatY;

              const startNx = p.baseX + 18 + sepEase * 10;
              const startNy = p.baseY - sepEase * 16;
              p.nx = startNx + (targetNx - startNx) * smooth;
              p.ny = startNy + (targetNy - startNy) * smooth;
            });

            // 繪製新生成的 O₂ / Cl₂ 雙原子共價鍵（當兩顆同種原子靠近時）
            for (let pair = 0; pair < 3; pair++) {
              const a = particles[pair * 2];
              const b = particles[pair * 2 + 1];
              if (a && b && dec > 0.45) {
                const bondAlpha = Math.min(1, (dec - 0.45) * 3);
                ctx.save();
                ctx.globalAlpha = bondAlpha;
                drawBondStick(
                  ctx, a.nx, a.ny, b.nx, b.ny,
                  isHgO ? '#b91c1c' : '#15803d',
                  5,
                  isHgO // O2 為雙鍵，Cl2 為單鍵
                );
                ctx.restore();
              }
            }

            // 繪製所有重組後的原子
            particles.forEach((p) => {
              drawAtom3D(ctx, p.mx, p.my, metalType, state.showSymbols);
              drawAtom3D(ctx, p.nx, p.ny, gasType, state.showSymbols);
            });
          }

          // 4. 斷鍵閃光粒子特效
          for (let i = sparks.length - 1; i >= 0; i--) {
            const sp = sparks[i];
            sp.r += 2.2 * s;
            sp.alpha -= 0.045 * s;
            if (sp.alpha <= 0) {
              sparks.splice(i, 1);
              continue;
            }
            ctx.save();
            ctx.globalAlpha = sp.alpha;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
            ctx.strokeStyle = sp.color;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
          }

          // 5. 頂部與底部清晰狀態標示
          if (dec > 0.78) {
            const gasName = isHgO ? '氧氣 O₂' : '氯氣 Cl₂';
            const metalName = isHgO ? '汞 Hg' : '銀 Ag';
            drawPillLabel(ctx, `元素 B：雙原子分子（${gasName} — 同種原子兩兩結合）`, W / 2, 24, {
              border: isHgO ? '#dc2626' : '#16a34a',
              color: isHgO ? '#991b1b' : '#166534',
              bg: 'rgba(255, 255, 255, 0.96)',
              fontSize: 12
            });
            drawPillLabel(ctx, `元素 A：單原子金屬元素（${metalName}）`, W / 2, H * 0.54, {
              border: '#475569', color: '#1e293b', bg: 'rgba(255, 255, 255, 0.96)', fontSize: 12
            });
            drawPillLabel(
              ctx,
              `💡 ${isHgO ? 'O₂' : 'Cl₂'} 雖是兩顆原子連在一起，但因是「同一種原子」，屬於元素而非化合物！`,
              W / 2,
              H - 20,
              { border: '#d97706', color: '#92400e', bg: 'rgba(255, 251, 235, 0.97)', fontSize: 11.5 }
            );
          } else if (state.decomposed) {
            drawPillLabel(ctx, '⚡ 化學鍵斷裂！原子正在重新排列結合成兩種「元素」…', W / 2, 24, {
              border: '#e11d48', color: '#be123c', bg: 'rgba(255, 241, 242, 0.96)', fontSize: 12.5
            });
          } else if (e >= 0.2) {
            drawPillLabel(
              ctx,
              `${isHgO ? '🔥 吸收熱能中' : '☀️ 吸收光能中'}：分子劇烈振動！能量達 62% 即斷鍵分解`,
              W / 2,
              24,
              { border: '#f97316', color: '#9a3412', bg: 'rgba(255, 247, 237, 0.96)', fontSize: 12 }
            );
          } else {
            drawPillLabel(
              ctx,
              `請拖曳下方${isHgO ? '加熱能量滑桿' : '照光強度滑桿'}，觀察化學鍵斷裂與原子重組`,
              W / 2,
              24,
              { border: '#0284c7', color: '#0369a1', bg: 'rgba(240, 249, 255, 0.96)', fontSize: 12 }
            );
          }
        }

        return {
          initCanvas,
          resize,
          initStage,
          stepAndDraw,
          triggerChemicalBondBreak
        };
      })();

      /* ======================================================================
         9. 自動播放與階段切換邏輯
         ====================================================================== */
      function goToStage(idx) {
        state.stage = Math.max(0, Math.min(4, idx));
        state.autoTimer = 0;

        // 更新時間軸樣式
        document.querySelectorAll('.step-pill').forEach((el) => {
          const s = Number(el.dataset.step);
          el.classList.toggle('active', s === state.stage);
          el.classList.toggle('completed', s < state.stage);
        });

        document.getElementById('btnPrev').disabled = state.stage === 0;
        document.getElementById('btnNext').disabled = state.stage === 4;

        MicroSim.initStage(state.stage);
        renderMacroSVG();
        updateConceptTree();
        updateInfoPanels();
        renderStageActionBar();
      }

      function toggleAutoPlay() {
        state.autoPlay = !state.autoPlay;
        state.autoTimer = 0;
        updateAutoPlayBtn();
        if (state.autoPlay) {
          // 若已在最後一階段且分解完成，從頭自動播放
          if (state.stage === 4 && state.decomposeProgress >= 0.98) {
            goToStage(0);
          }
        }
      }

      function stopAutoPlay() {
        if (!state.autoPlay) return;
        state.autoPlay = false;
        updateAutoPlayBtn();
      }

      function updateAutoPlayBtn() {
        const btn = document.getElementById('btnAutoPlay');
        if (state.autoPlay) {
          btn.textContent = '⏸ 暫停播放';
          btn.classList.remove('primary');
          btn.classList.add('playing');
        } else {
          btn.textContent = '▶ 自動播放';
          btn.classList.remove('playing');
          btn.classList.add('primary');
        }
      }

      function handleAutoPlay(dt) {
        state.autoTimer += dt;
        if (state.stage === 0) {
          if (state.autoTimer > 4.2) goToStage(1);
        } else if (state.stage === 1) {
          if (state.autoTimer > 0.7 && !state.filterRunning && state.filterProgress < 0.05) {
            state.filterRunning = true;
            renderStageActionBar();
          }
          if (state.filterProgress >= 0.99 && state.autoTimer > 8.2) {
            goToStage(2);
          }
        } else if (state.stage === 2) {
          if (state.autoTimer > 0.7 && !state.evapRunning && state.evapProgress < 0.05) {
            state.evapRunning = true;
            renderStageActionBar();
          }
          if (state.evapProgress >= 0.99 && state.autoTimer > 8.6) {
            goToStage(3);
          }
        } else if (state.stage === 3) {
          if (state.autoTimer > 4.6) goToStage(4);
        } else if (state.stage === 4) {
          if (state.autoTimer > 0.8 && !state.energyAutoRamp && state.energy < 10) {
            state.energyAutoRamp = true;
            renderStageActionBar();
          }
          if (state.decomposeProgress >= 0.99 && state.autoTimer > 11.5) {
            stopAutoPlay();
          }
        }
      }

      /* ======================================================================
         10. 微觀粒子隨堂測驗模組 (5 題動態 Canvas 示意圖 + 即時解析)

      const QuizModule = (function () {
        let qCanvas, qCtx;
        let QW = 440, QH = 330;
        let qParticles = [];

            answerLabel: '元素（純物質）',
            shortName: '雙原子元素（如氧氣 O₂）',

            build: (w, h) => {
              const arr = [];
              for (let i = 0; i < 9; i++) {
                arr.push({ shape: 'tri_bent', a1: 'O', a2: 'H', x: 65 + (i % 3) * ((w - 130) / 2), y: 65 + Math.floor(i / 3) * ((h - 130) / 2), vx: (Math.random() - 0.5) * 1.3, vy: (Math.random() - 0.5) * 1.3, ang: Math.random() * 6, va: (Math.random() - 0.5) * 0.03 });

          },
