<body class="min-h-screen flex flex-col font-sans">

    <!-- JavaScript Optics Target Game Engine -->
    <script>
        /* ==========================================================================
           1. Audio Synthesizer (Web Audio API)
           ========================================================================== */
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('mute-icon');
            icon.className = isMuted ? 'fa-solid fa-volume-xmark text-rose-400' : 'fa-solid fa-volume-high';
            if (!isMuted) playClickSound();
        }

        function playClickSound() {
            if (isMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playLaserSound() {
            if (isMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playWinSound() {
            if (isMuted) return;
            initAudio();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.3);
            });
        }

        /* ==========================================================================
           2. Vector Math & Optics Physics Engine
           ========================================================================== */
        const Vec = {
            add: (v1, v2) => ({ x: v1.x + v2.x, y: v1.y + v2.y }),
            sub: (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y }),
            mult: (v, s) => ({ x: v.x * s, y: v.y * s }),
            dot: (v1, v2) => v1.x * v2.x + v1.y * v2.y,
            cross: (v1, v2) => v1.x * v2.y - v1.y * v2.x,
            len: (v) => Math.hypot(v.x, v.y),
            norm: (v) => {
                const l = Math.hypot(v.x, v.y);
                return l === 0 ? { x: 0, y: 0 } : { x: v.x / l, y: v.y / l };
            },
            rot: (v, rad) => ({
                x: v.x * Math.cos(rad) - v.y * Math.sin(rad),
                y: v.x * Math.sin(rad) + v.y * Math.cos(rad)
            }),
            dist: (v1, v2) => Math.hypot(v1.x - v2.x, v1.y - v2.y)
        };

        function intersectRaySegment(P, D, A, B) {
            const E = Vec.sub(B, A);
            const det = D.x * E.y - D.y * E.x;
            if (Math.abs(det) < 1e-6) return null;

            const t = ((A.x - P.x) * E.y - (A.y - P.y) * E.x) / det;
            const s = ((A.x - P.x) * D.y - (A.y - P.y) * D.x) / det;

            if (t > 1e-4 && s >= 0 && s <= 1) {
                return { t, point: Vec.add(P, Vec.mult(D, t)), s };
            }
            return null;
        }

        function distToSegment(P, A, B) {
            const l2 = (B.x - A.x)**2 + (B.y - A.y)**2;
            if (l2 === 0) return Vec.dist(P, A);
            let t = ((P.x - A.x) * (B.x - A.x) + (P.y - A.y) * (B.y - A.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            const proj = { x: A.x + t * (B.x - A.x), y: A.y + t * (B.y - A.y) };
            return Vec.dist(P, proj);
        }

        function computeRefraction(I, N, n1, n2) {
            let normal = { ...N };
            let cosI = -Vec.dot(I, normal);
            if (cosI < 0) {
                cosI = -cosI;
                normal = Vec.mult(normal, -1);
            }
            const eta = n1 / n2;
            const k = 1 - eta * eta * (1 - cosI * cosI);

            if (k < 0) {
                const R = Vec.sub(I, Vec.mult(normal, 2 * Vec.dot(I, normal)));
                return { dir: Vec.norm(R), isTIR: true };
            } else {
                const cosT = Math.sqrt(k);
                const T = Vec.add(Vec.mult(I, eta), Vec.mult(normal, eta * cosI - cosT));
                return { dir: Vec.norm(T), isTIR: false };
            }
        }

        function getPolygonEdges(obj) {
            let pts = [];
            if (obj.shape === 'rect') {
                const w = obj.w, h = obj.h;
                const rad = (obj.angle || 0) * Math.PI / 180;
                const localPts = [
                    { x: -w/2, y: -h/2 }, { x: w/2, y: -h/2 },
                    { x: w/2, y: h/2 }, { x: -w/2, y: h/2 }
                ];
                pts = localPts.map(p => Vec.add(obj.center, Vec.rot(p, rad)));
            }
            const edges = [];
            for (let i = 0; i < pts.length; i++) {
                edges.push({ p1: pts[i], p2: pts[(i + 1) % pts.length] });
            }
            return edges;
        }

        /* Multi-Color Multi-Target Ray Tracing Engine */
        function traceRayPathFull(origin, direction, rayColor, objects, targets, maxBounces = 25) {
            let currentOrigin = { ...origin };
            let currentDir = Vec.norm(direction);
            let currentMediumN = 1.0;
            const steps = [];

            for (let bounce = 0; bounce < maxBounces; bounce++) {
                let closestHit = null;

                // Check mirrors, walls, glasses
                objects.forEach(obj => {
                    if (obj.type === 'mirror') {
                        const hit = intersectRaySegment(currentOrigin, currentDir, obj.p1, obj.p2);
                        if (hit && (!closestHit || hit.t < closestHit.t)) {
                            const seg = Vec.sub(obj.p2, obj.p1);
                            const norm = Vec.norm({ x: -seg.y, y: seg.x });
                            closestHit = { ...hit, object: obj, type: 'mirror', normal: norm };
                        }
                    } else if (obj.type === 'wall') {
                        const edges = getPolygonEdges(obj);
                        edges.forEach(edge => {
                            const hit = intersectRaySegment(currentOrigin, currentDir, edge.p1, edge.p2);
                            if (hit && (!closestHit || hit.t < closestHit.t)) {
                                closestHit = { ...hit, object: obj, type: 'wall' };
                            }
                        });
                    } else if (obj.type === 'glass') {
                        const edges = getPolygonEdges(obj);
                        edges.forEach(edge => {
                            const hit = intersectRaySegment(currentOrigin, currentDir, edge.p1, edge.p2);
                            if (hit && (!closestHit || hit.t < closestHit.t)) {
                                const seg = Vec.sub(edge.p2, edge.p1);
                                const norm = Vec.norm({ x: -seg.y, y: seg.x });
                                closestHit = { ...hit, object: obj, type: 'glass', normal: norm };
                            }
                        });
                    }
                });

                let segLen = 1200;
                let nextOrigin = Vec.add(currentOrigin, Vec.mult(currentDir, segLen));
                let hitInfo = null;

                if (closestHit) {
                    segLen = closestHit.t;
                    nextOrigin = closestHit.point;
                    hitInfo = closestHit;
                }

                // Check if this ray segment passes through any targets (Color-Matching)
                targets.forEach(target => {
                    const dist = distToSegment(target.center, currentOrigin, nextOrigin);
                    if (dist <= target.radius) {
                        // Check color matching!
                        if (target.color.toLowerCase() === rayColor.toLowerCase()) {
                            target.hit = true;
                        }
                    }
                });

                steps.push({
                    p1: currentOrigin,
                    p2: nextOrigin,
                    dir: currentDir,
                    length: segLen,
                    color: rayColor,
                    mediumN: currentMediumN,
                    hit: hitInfo
                });

                if (!closestHit || closestHit.type === 'wall') break;

                if (closestHit.type === 'mirror') {
                    let N = closestHit.normal;
                    if (Vec.dot(currentDir, N) > 0) N = Vec.mult(N, -1);
                    const refDir = Vec.norm(Vec.sub(currentDir, Vec.mult(N, 2 * Vec.dot(currentDir, N))));
                    currentDir = refDir;
                    currentOrigin = Vec.add(nextOrigin, Vec.mult(currentDir, 0.1));
                } else if (closestHit.type === 'glass') {
                    let N = closestHit.normal;
                    let n1 = currentMediumN;
                    let n2 = closestHit.object.n || 1.5;

                    if (Vec.dot(currentDir, N) > 0) {
                        N = Vec.mult(N, -1);
                        n1 = closestHit.object.n || 1.5;
                        n2 = 1.0;
                    }
                    const refr = computeRefraction(currentDir, N, n1, n2);
                    currentDir = refr.dir;
                    currentMediumN = refr.isTIR ? n1 : n2;
                    currentOrigin = Vec.add(nextOrigin, Vec.mult(currentDir, 0.2));
                }
            }

            return steps;
        }

        /* ==========================================================================
           3. Game Levels & Setup
           ========================================================================== */
        const GAME_LEVELS = [
            {
                title: "關卡 1: 平面鏡反射入門",

        /* ==========================================================================
           4. Game State & Logic
           ========================================================================== */
        const gameCanvas = document.getElementById('gameCanvas');
        const gameCtx = gameCanvas.getContext('2d');

        let currentGameLevelIdx = 0;
        let gameEmitters = [];
        let gameTargets = [];
        let gameFixedObjects = [];
        let gamePlayerObjects = []; // Mirror history stack
        let gameActiveTool = 'draw_mirror';

        let isDrawingMirror = false;
        let drawStartPt = null;
        let drawCurrentPt = null;

        let isErasing = false;
        let eraserPos = { x: 0, y: 0 };

        let calculatedRays = [];

        function initLevelSelect() {
            const select = document.getElementById('game-level-select');
            select.innerHTML = '';
            GAME_LEVELS.forEach((lvl, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = lvl.title;
                select.appendChild(opt);
            });
        }

        function loadGameLevel(idx) {
            currentGameLevelIdx = idx;
            const level = GAME_LEVELS[idx];
            document.getElementById('game-level-title').textContent = level.title;
            document.getElementById('game-level-desc').textContent = level.desc;
            document.getElementById('game-level-select').value = idx;

            gameEmitters = JSON.parse(JSON.stringify(level.emitters));
            gameTargets = JSON.parse(JSON.stringify(level.targets));
            gameFixedObjects = JSON.parse(JSON.stringify(level.fixedObjects));
            gamePlayerObjects = [];

            updateGameStats();
            recalcGameRay();
        }

        function setGameTool(tool) {
            gameActiveTool = tool;
            playClickSound();

            const drawBtn = document.getElementById('tool-draw-mirror');
            const eraseBtn = document.getElementById('tool-eraser');

            if (tool === 'draw_mirror') {
                drawBtn.className = "p-3 rounded-xl border bg-cyan-950/60 border-cyan-500 text-cyan-300 text-xs font-bold flex items-center gap-3 transition glow-cyan";
                eraseBtn.className = "p-3 rounded-xl border bg-slate-900 border-slate-700 text-slate-300 text-xs font-bold flex items-center gap-3 hover:border-slate-500 transition";
                document.getElementById('game-canvas-status-tip').innerHTML = `<i class="fa-solid fa-pen text-cyan-400"></i> 【畫平面鏡模式】：拖曳畫鏡，繪製時即時顯示法線與直角符號！`;
            } else {
                eraseBtn.className = "p-3 rounded-xl border bg-rose-950/60 border-rose-500 text-rose-300 text-xs font-bold flex items-center gap-3 transition glow-pink";
                drawBtn.className = "p-3 rounded-xl border bg-slate-900 border-slate-700 text-slate-300 text-xs font-bold flex items-center gap-3 hover:border-slate-500 transition";
                document.getElementById('game-canvas-status-tip').innerHTML = `<i class="fa-solid fa-eraser text-rose-400"></i> 【橡皮擦模式】：點擊或拖曳擦除已畫出的鏡面！`;
            }
        }

        /* Undo Feature (復原) */
        function undoPlayerMirror() {
            if (gamePlayerObjects.length > 0) {
                gamePlayerObjects.pop();
                playClickSound();
                updateGameStats();
                recalcGameRay();
            }
        }

        function clearPlayerDrawnGameObjects() {
            playClickSound();
            gamePlayerObjects = [];
            updateGameStats();
            recalcGameRay();
        }

        function updateGameStats() {
            document.getElementById('game-mirrors-count').textContent = `${gamePlayerObjects.length} 面`;

            const hitCount = gameTargets.filter(t => t.hit).length;
            document.getElementById('game-target-progress').textContent = `${hitCount} / ${gameTargets.length} 命中`;

            // Render Target Status Badges
            const list = document.getElementById('targets-status-list');
            list.innerHTML = '';
            gameTargets.forEach(t => {
                const badge = document.createElement('div');
                badge.className = "flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800 text-[11px]";
                badge.innerHTML = `
                    <span class="flex items-center gap-1.5 font-bold" style="color: ${t.color}">
                        <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${t.color}"></span>
                        ${t.name}
                    </span>
                    <span class="${t.hit ? 'text-emerald-400 font-bold' : 'text-slate-500'}">
                        ${t.hit ? '✓ 命中' : '未觸發'}
                    </span>
                `;
                list.appendChild(badge);
            });
        }

        function recalcGameRay() {
            // Reset Target Hit states
            gameTargets.forEach(t => t.hit = false);

            const allObjs = [...gameFixedObjects, ...gamePlayerObjects];
            calculatedRays = [];

            gameEmitters.forEach(emitter => {
                const rad = emitter.angle * Math.PI / 180;
                const dir = { x: Math.cos(rad), y: Math.sin(rad) };
                const raySteps = traceRayPathFull(emitter.center, dir, emitter.color, allObjs, gameTargets);
                calculatedRays.push(raySteps);
            });

            updateGameStats();
        }

        function triggerGameTestLaunch() {
            playLaserSound();
            recalcGameRay();

            // Check victory condition
            const allTargetsHit = gameTargets.length > 0 && gameTargets.every(t => t.hit);
            if (allTargetsHit) {
                playWinSound();
                setTimeout(() => toggleVictoryModal(true), 300);
            }
        }

        function nextGameLevel() {
            if (currentGameLevelIdx < GAME_LEVELS.length - 1) {
                loadGameLevel(currentGameLevelIdx + 1);
            } else {
                loadGameLevel(0);
            }
        }

        function toggleHintModal() {
            document.getElementById('hint-text').textContent = GAME_LEVELS[currentGameLevelIdx].hint;
            document.getElementById('hint-modal').classList.toggle('hidden');
        }

        function toggleVictoryModal(show) {
            const modal = document.getElementById('victory-modal');
            if (show) {
                document.getElementById('victory-level-name').textContent = GAME_LEVELS[currentGameLevelIdx].title;
                document.getElementById('victory-physics-explain').textContent = GAME_LEVELS[currentGameLevelIdx].physics;
                document.getElementById('victory-this-count').textContent = `${gamePlayerObjects.length} 面`;

                if (currentGameLevelIdx === GAME_LEVELS.length - 1) {
                    document.getElementById('victory-header-text').textContent = "🎉 恭喜通關全部關卡！Grand Master!";
                } else {
                    document.getElementById('victory-header-text').textContent = "精準貫穿標靶！ Target Destroyed!";
                }

                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function eraseAtPos(pos) {
            const beforeLen = gamePlayerObjects.length;
            gamePlayerObjects = gamePlayerObjects.filter(obj => distToSegment(pos, obj.p1, obj.p2) > 18);
            if (gamePlayerObjects.length !== beforeLen) {
                playClickSound();
                updateGameStats();
                recalcGameRay();
            }
        }

        /* Canvas Event Handlers */
        gameCanvas.addEventListener('pointerdown', (e) => {
            const rect = gameCanvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (gameCanvas.width / rect.width);
            const my = (e.clientY - rect.top) * (gameCanvas.height / rect.height);

            if (gameActiveTool === 'draw_mirror') {
                isDrawingMirror = true;
                drawStartPt = { x: mx, y: my };
                drawCurrentPt = { x: mx, y: my };
            } else if (gameActiveTool === 'eraser') {
                isErasing = true;
                eraserPos = { x: mx, y: my };
                eraseAtPos(eraserPos);
            }
        });

        gameCanvas.addEventListener('pointermove', (e) => {
            const rect = gameCanvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (gameCanvas.width / rect.width);
            const my = (e.clientY - rect.top) * (gameCanvas.height / rect.height);

            if (isDrawingMirror) {
                drawCurrentPt = { x: mx, y: my };
            } else if (isErasing) {
                eraserPos = { x: mx, y: my };
                eraseAtPos(eraserPos);
            }
        });

        window.addEventListener('pointerup', () => {
            if (isDrawingMirror && drawStartPt && drawCurrentPt) {
                const len = Vec.len(Vec.sub(drawCurrentPt, drawStartPt));
                if (len > 15) {
                    gamePlayerObjects.push({
                        id: Date.now(),
                        type: 'mirror',
                        p1: drawStartPt,
                        p2: drawCurrentPt,
                        isPlayer: true
                    });
                    playClickSound();
                    updateGameStats();
                    recalcGameRay();

                    // Real-time check victory when drawing
                    if (gameTargets.length > 0 && gameTargets.every(t => t.hit)) {
                        playWinSound();
                        setTimeout(() => toggleVictoryModal(true), 300);
                    }
                }
            }
            isDrawingMirror = false;
            isErasing = false;
            drawStartPt = null;
            drawCurrentPt = null;
        });

        /* ==========================================================================
           5. Main Render Loop
           ========================================================================== */
        function renderGame() {
            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            // Grid Background
            gameCtx.strokeStyle = 'rgba(31, 41, 61, 0.4)';
            gameCtx.lineWidth = 1;
            for (let x = 0; x < gameCanvas.width; x += 40) {
                gameCtx.beginPath(); gameCtx.moveTo(x, 0); gameCtx.lineTo(x, gameCanvas.height); gameCtx.stroke();
            }
            for (let y = 0; y < gameCanvas.height; y += 40) {
                gameCtx.beginPath(); gameCtx.moveTo(0, y); gameCtx.lineTo(gameCanvas.width, y); gameCtx.stroke();
            }

            // Draw Fixed Objects & Player Mirrors
            [...gameFixedObjects, ...gamePlayerObjects].forEach(obj => {
                if (obj.type === 'wall') drawWall(gameCtx, obj);
                else if (obj.type === 'mirror') drawMirror(gameCtx, obj);
                else if (obj.type === 'glass') drawGlass(gameCtx, obj);
            });

            // Draw Targets
            gameTargets.forEach(t => drawTarget(gameCtx, t));

            // Draw Emitters
            gameEmitters.forEach(em => drawEmitterObj(gameCtx, em.center, em.angle, em.color));

            // Draw Light Rays
            calculatedRays.forEach(raySteps => {
                raySteps.forEach(step => {
                    drawGlowingRay(gameCtx, step.p1, step.p2, step.color, 3);
                });
            });

            // Real-time Mirror Preview when Drawing
            if (isDrawingMirror && drawStartPt && drawCurrentPt) {
                gameCtx.save();
                gameCtx.strokeStyle = '#22d3ee';
                gameCtx.lineWidth = 4;
                gameCtx.beginPath();
                gameCtx.moveTo(drawStartPt.x, drawStartPt.y);
                gameCtx.lineTo(drawCurrentPt.x, drawCurrentPt.y);
                gameCtx.stroke();

                // Real-time Normal Preview
                const midP = Vec.mult(Vec.add(drawStartPt, drawCurrentPt), 0.5);
                const segVec = Vec.sub(drawCurrentPt, drawStartPt);
                const segLen = Vec.len(segVec);

                if (segLen > 10) {
                    const normVec = Vec.norm({ x: -segVec.y, y: segVec.x });
                    const normLen = 35;

                    gameCtx.strokeStyle = '#f59e0b';
                    gameCtx.lineWidth = 1.8;
                    gameCtx.setLineDash([4, 4]);
                    gameCtx.beginPath();
                    gameCtx.moveTo(midP.x - normVec.x * normLen, midP.y - normVec.y * normLen);
                    gameCtx.lineTo(midP.x + normVec.x * normLen, midP.y + normVec.y * normLen);
                    gameCtx.stroke();
                    gameCtx.setLineDash([]);

                    // Right angle indicator
                    const dirU = Vec.norm(segVec);
                    const sqSize = 8;
                    const pA = Vec.add(midP, Vec.mult(dirU, sqSize));
                    const pB = Vec.add(pA, Vec.mult(normVec, sqSize));
                    const pC = Vec.add(midP, Vec.mult(normVec, sqSize));

                    gameCtx.strokeStyle = '#f59e0b';
                    gameCtx.lineWidth = 1.2;
                    gameCtx.beginPath();
                    gameCtx.moveTo(pA.x, pA.y);
                    gameCtx.lineTo(pB.x, pB.y);
                    gameCtx.lineTo(pC.x, pC.y);
                    gameCtx.stroke();
                }
                gameCtx.restore();
            }

            // Eraser Cursor Indicator
            if (gameActiveTool === 'eraser' && eraserPos) {
                gameCtx.save();
                gameCtx.strokeStyle = '#f43f5e';
                gameCtx.lineWidth = 2;
                gameCtx.beginPath();
                gameCtx.arc(eraserPos.x, eraserPos.y, 18, 0, Math.PI * 2);
                gameCtx.stroke();
                gameCtx.restore();
            }

            requestAnimationFrame(renderGame);
        }

        /* ==========================================================================
           6. Graphics Drawing Helpers
           ========================================================================== */
        function drawGlowingRay(ctx, p1, p2, color, width) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = width * 0.4;
            ctx.shadowBlur = 0;
            ctx.stroke();
            ctx.restore();
        }

        function drawEmitterObj(ctx, center, angleDeg, color = '#06b6d4') {
            ctx.save();
            ctx.translate(center.x, center.y);
            ctx.rotate(angleDeg * Math.PI / 180);

            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = color;
            ctx.fillRect(0, -5, 24, 10);
            ctx.restore();
        }

        function drawMirror(ctx, obj) {
            ctx.save();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 5;
            ctx.shadowColor = '#06b6d4';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(obj.p1.x, obj.p1.y);
            ctx.lineTo(obj.p2.x, obj.p2.y);
            ctx.stroke();
            ctx.restore();
        }

        function drawGlass(ctx, obj) {
            ctx.save();
            const edges = getPolygonEdges(obj);
            ctx.fillStyle = 'rgba(6, 182, 212, 0.22)';
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(edges[0].p1.x, edges[0].p1.y);
            edges.forEach(e => ctx.lineTo(e.p2.x, e.p2.y));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawWall(ctx, obj) {
            ctx.save();
            const edges = getPolygonEdges(obj);
            ctx.fillStyle = '#020617';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(edges[0].p1.x, edges[0].p1.y);
            edges.forEach(e => ctx.lineTo(e.p2.x, e.p2.y));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawTarget(ctx, obj) {
            ctx.save();
            ctx.translate(obj.center.x, obj.center.y);

            const color = obj.color || '#06b6d4';

            // Target Outer Ring
            ctx.strokeStyle = color;
            ctx.lineWidth = obj.hit ? 4 : 2.5;
            ctx.shadowColor = color;
            ctx.shadowBlur = obj.hit ? 20 : 8;
            ctx.beginPath();
            ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
            ctx.stroke();

            // Inner Ring
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, obj.radius * 0.5, 0, Math.PI * 2);
            ctx.stroke();

            // Center Point / Checkmark
            if (obj.hit) {
                ctx.fillStyle = '#10b981';
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px font-sans';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('✓', 0, 0);
            } else {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        /* App Initialization */
        window.onload = function () {
            initLevelSelect();
            loadGameLevel(0);
            requestAnimationFrame(renderGame);
        };
    </script>
</body>
